<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" role="img" aria-labelledby="ivt ivd">
  <title id="ivt">An embedding and a dimension model answering the same question</title>
  <desc id="ivd">Asked why one person ranks above another, an embedding model can return a similarity figure and the nearest neighbours that produced it, but the axes have no names, so the answer is that the vectors were closer. A dimension model returns the contribution of each named dimension, so the answer is that health and career contributed most while finance contributed almost nothing because the claim was never evidenced. The second answer can be argued with, and acted on.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .emb { fill: #ffffff; stroke: #97928a; stroke-width: 1.3; }
    .dim { fill: #f6ece4; stroke: #b4541e; stroke-width: 1.4; }
    .k { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; fill: #97928a; }
    .kd { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; fill: #b4541e; }
    .h { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 14px; fill: #17161b; }
    .s { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #3f3c45; }
    .q { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 15px; fill: #17161b; font-style: italic; }
    .barbg { fill: #f1ede4; }
    .bar { fill: #b4541e; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
  </style>
  <rect class="bg" width="560" height="520" rx="8"/>
  <rect class="card" x="24" y="24" width="512" height="48" rx="6"/>
  <text class="q" x="280" y="54" text-anchor="middle">&#34;Why does he rank above the other one?&#34;</text>
  <text class="k" x="34" y="98">AN EMBEDDING CAN SAY</text>
  <rect class="emb" x="24" y="110" width="512" height="94" rx="6"/>
  <text class="m" x="44" y="138">similarity 0.83 · nearest neighbours: #41, #77, #12</text>
  <text class="s" x="44" y="164">The axes have no names, so the honest answer is</text>
  <text class="s" x="44" y="184">that the vectors were closer. There is nothing to act on.</text>
  <text class="kd" x="34" y="234">A DIMENSION MODEL CAN SAY</text>
  <rect class="dim" x="24" y="246" width="512" height="182" rx="6"/>
  <text class="s" x="44" y="272">contribution to his score, by dimension</text>
  <text class="m" x="44" y="298">health</text>
  <rect class="barbg" x="160" y="288" width="300" height="12" rx="3"/>
  <rect class="bar" x="160" y="288" width="216" height="12" rx="3"/>
  <text class="m" x="472" y="298">28</text>
  <text class="m" x="44" y="328">career</text>
  <rect class="barbg" x="160" y="318" width="300" height="12" rx="3"/>
  <rect class="bar" x="160" y="318" width="180" height="12" rx="3"/>
  <text class="m" x="472" y="328">24</text>
  <text class="m" x="44" y="358">finance</text>
  <rect class="barbg" x="160" y="348" width="300" height="12" rx="3"/>
  <rect class="bar" x="160" y="348" width="34" height="12" rx="3"/>
  <text class="m" x="472" y="358">4</text>
  <text class="s" x="44" y="388">Finance is near zero because he claimed it and never evidenced it.</text>
  <text class="s" x="44" y="410">Proving it moves him from fourth to second. Exactly, not approximately.</text>
  <rect class="card" x="24" y="446" width="512" height="52" rx="6"/>
  <text class="foot" x="280" y="478" text-anchor="middle">The second answer can be argued with. That is the whole trade.</text>
</svg>
