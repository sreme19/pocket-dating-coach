<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" width="560" height="650" role="img" aria-labelledby="mht mhd">
  <title id="mht">Four ways the math, code and reason layers hand off</title>
  <desc id="mhd">Four short chains of stages, colored by layer. Solve, then narrate, used by the cricket, spy and strategy oracles: a solver decides, code logs the decision trace, and a model writes the brief. Read, compute, write, used by the dating matchmaker: a model reads each profile into scores, math scores every pair, a min-cost flow assigns matches, and a model writes the introduction. Gate, generate, guard, used by the clinic chatbot and the dating replies: code screens the message, a model answers, code checks the reply, and only then does a person read it. Propose, then prove, used by the lead-routing editor: a model drafts a configuration patch, code replays it against 5,501 past decisions, and a person approves.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .reason { fill: #f6ece4; stroke: #b4541e; stroke-width: 1.4; }
    .code { fill: #f3f1ec; stroke: #17161b; stroke-width: 1.2; }
    .math { fill: #e8f0ea; stroke: #2f6b46; stroke-width: 1.4; }
    .person { fill: #ffffff; stroke: #97928a; stroke-width: 1.2; stroke-dasharray: 3 2; }
    .h { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 15px; fill: #17161b; }
    .ex { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6e6a63; }
    .p { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #17161b; }
    .lr { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; fill: #b4541e; }
    .lc { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; fill: #17161b; }
    .lm { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; fill: #2f6b46; }
    .lp { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; fill: #6e6a63; }
    .rule { stroke: #e8e3d8; stroke-width: 1; }
    .arrow { stroke: #97928a; stroke-width: 1.5; fill: none; }
    @media (prefers-reduced-motion: no-preference) {
      .arrow { stroke-dasharray: 4 4; animation: mh-flow 0.9s linear infinite; }
    }
    @keyframes mh-flow { to { stroke-dashoffset: -8; } }
  </style>
  <defs>
    <marker id="mh-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#97928a"/>
    </marker>
  </defs>
  <rect class="bg" width="560" height="650" rx="8"/>

  <!-- Row 1: solve, then narrate -->
  <text class="h" x="22" y="40">Solve, then narrate</text>
  <text class="ex" x="22" y="58">Cricket XI, spy-thriller and strategy oracles</text>
  <rect class="math" x="88" y="72" width="112" height="50" rx="6"/>
  <text class="lm" x="144" y="90" text-anchor="middle">MATH</text>
  <text class="p" x="144" y="108" text-anchor="middle">Solver decides</text>
  <path class="arrow" d="M202 97 L220 97" marker-end="url(#mh-a)"/>
  <rect class="code" x="224" y="72" width="112" height="50" rx="6"/>
  <text class="lc" x="280" y="90" text-anchor="middle">CODE</text>
  <text class="p" x="280" y="108" text-anchor="middle">Trace is logged</text>
  <path class="arrow" d="M338 97 L356 97" marker-end="url(#mh-a)"/>
  <rect class="reason" x="360" y="72" width="112" height="50" rx="6"/>
  <text class="lr" x="416" y="90" text-anchor="middle">REASON</text>
  <text class="p" x="416" y="108" text-anchor="middle">Writes the brief</text>
  <line class="rule" x1="22" y1="146" x2="538" y2="146"/>

  <!-- Row 2: read, compute, write -->
  <text class="h" x="22" y="176">Read, compute, write</text>
  <text class="ex" x="22" y="194">Dating matchmaker</text>
  <rect class="reason" x="22" y="208" width="112" height="50" rx="6"/>
  <text class="lr" x="78" y="226" text-anchor="middle">REASON</text>
  <text class="p" x="78" y="244" text-anchor="middle">Reads a profile</text>
  <path class="arrow" d="M136 233 L154 233" marker-end="url(#mh-a)"/>
  <rect class="math" x="158" y="208" width="112" height="50" rx="6"/>
  <text class="lm" x="214" y="226" text-anchor="middle">MATH</text>
  <text class="p" x="214" y="244" text-anchor="middle">Scores every pair</text>
  <path class="arrow" d="M272 233 L290 233" marker-end="url(#mh-a)"/>
  <rect class="math" x="294" y="208" width="112" height="50" rx="6"/>
  <text class="lm" x="350" y="226" text-anchor="middle">MATH</text>
  <text class="p" x="350" y="244" text-anchor="middle">Flow assigns</text>
  <path class="arrow" d="M408 233 L426 233" marker-end="url(#mh-a)"/>
  <rect class="reason" x="430" y="208" width="112" height="50" rx="6"/>
  <text class="lr" x="486" y="226" text-anchor="middle">REASON</text>
  <text class="p" x="486" y="244" text-anchor="middle">Writes the intro</text>
  <line class="rule" x1="22" y1="282" x2="538" y2="282"/>

  <!-- Row 3: gate, generate, guard -->
  <text class="h" x="22" y="312">Gate, generate, guard</text>
  <text class="ex" x="22" y="330">Clinic chatbot, dating replies</text>
  <rect class="code" x="22" y="344" width="112" height="50" rx="6"/>
  <text class="lc" x="78" y="362" text-anchor="middle">CODE</text>
  <text class="p" x="78" y="380" text-anchor="middle">Screens message</text>
  <path class="arrow" d="M136 369 L154 369" marker-end="url(#mh-a)"/>
  <rect class="reason" x="158" y="344" width="112" height="50" rx="6"/>
  <text class="lr" x="214" y="362" text-anchor="middle">REASON</text>
  <text class="p" x="214" y="380" text-anchor="middle">Model answers</text>
  <path class="arrow" d="M272 369 L290 369" marker-end="url(#mh-a)"/>
  <rect class="code" x="294" y="344" width="112" height="50" rx="6"/>
  <text class="lc" x="350" y="362" text-anchor="middle">CODE</text>
  <text class="p" x="350" y="380" text-anchor="middle">Checks the reply</text>
  <path class="arrow" d="M408 369 L426 369" marker-end="url(#mh-a)"/>
  <rect class="person" x="430" y="344" width="112" height="50" rx="6"/>
  <text class="lp" x="486" y="362" text-anchor="middle">PERSON</text>
  <text class="p" x="486" y="380" text-anchor="middle">Reads it</text>
  <line class="rule" x1="22" y1="418" x2="538" y2="418"/>

  <!-- Row 4: propose, then prove -->
  <text class="h" x="22" y="448">Propose, then prove</text>
  <text class="ex" x="22" y="466">Lead-routing configuration editor</text>
  <rect class="reason" x="88" y="480" width="112" height="50" rx="6"/>
  <text class="lr" x="144" y="498" text-anchor="middle">REASON</text>
  <text class="p" x="144" y="516" text-anchor="middle">Drafts a patch</text>
  <path class="arrow" d="M202 505 L220 505" marker-end="url(#mh-a)"/>
  <rect class="code" x="224" y="480" width="112" height="50" rx="6"/>
  <text class="lc" x="280" y="498" text-anchor="middle">CODE</text>
  <text class="p" x="280" y="516" text-anchor="middle">Replays 5,501</text>
  <path class="arrow" d="M338 505 L356 505" marker-end="url(#mh-a)"/>
  <rect class="person" x="360" y="480" width="112" height="50" rx="6"/>
  <text class="lp" x="416" y="498" text-anchor="middle">PERSON</text>
  <text class="p" x="416" y="516" text-anchor="middle">Approves</text>

  <!-- Legend -->
  <line class="rule" x1="22" y1="562" x2="538" y2="562"/>
  <rect class="reason" x="40" y="584" width="16" height="12" rx="3"/>
  <text class="ex" x="62" y="594">Reason: the model</text>
  <rect class="code" x="176" y="584" width="16" height="12" rx="3"/>
  <text class="ex" x="198" y="594">Code: rules</text>
  <rect class="math" x="284" y="584" width="16" height="12" rx="3"/>
  <text class="ex" x="306" y="594">Math: solvers</text>
  <rect class="person" x="396" y="584" width="16" height="12" rx="3"/>
  <text class="ex" x="418" y="594">A person</text>
  <text class="ex" x="280" y="626" text-anchor="middle">Errors collect at the arrows, so that is where the checks go.</text>
</svg>
