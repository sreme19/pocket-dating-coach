<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 900" width="560" height="900"
     role="img" aria-labelledby="lgtTitle lgtDesc">
  <title id="lgtTitle">The intelligence oracle wired as a LangGraph state machine</title>
  <desc id="lgtDesc">A vertical pipeline. A start marker flows into an Assemble state node. That
  node fans out to two branches that run at once — Intel network and Coalition, both NetworkX graph
  analyses — which fan back in to a single Belief estimate node; the fan-in is a barrier that waits
  for both, and the shared error and warning lists are merged with an append reducer rather than one
  branch overwriting the other. From Belief estimate the flow is a straight sequential spine: Value of
  Information, Adversary via a Stackelberg model, Strategy via a POMDP planner, Critical path via
  CPM and PERT, and a Monte Carlo Simulator. After the simulator a conditional fork checks for a fatal
  error: on error it routes straight to END and skips narration, otherwise it routes to a Narrate node
  that uses Claude and then to END. State is snapshotted at each node boundary, so a long run can
  resume after a crash or pause for a human at the fork.</desc>

  <style>
    .paper { fill:#fcfbf8; }
    .card  { fill:#ffffff; stroke:#e8e3d8; stroke-width:1.5; }
    .soft  { fill:#f6ece4; stroke:#e6d3c2; stroke-width:1; }
    .h     { font-family:'Iowan Old Style', Palatino, Georgia, serif; fill:#17161b; }
    .l     { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; }
    .ink   { fill:#17161b; } .mut { fill:#6e6a63; } .acc { fill:#b4541e; } .grn { fill:#2f6b46; }
    .edge  { stroke:#6e6a63; stroke-width:1.6; fill:none; }
    .flow  { stroke:#b4541e; stroke-width:2; fill:none; }
    @media (prefers-reduced-motion: no-preference) {
      .flow { stroke-dasharray:6 6; animation:march 1s linear infinite; }
      @keyframes march { to { stroke-dashoffset:-12; } }
    }
  </style>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 3 L0 6 Z" fill="#6e6a63"/>
    </marker>
    <marker id="aha" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 3 L0 6 Z" fill="#b4541e"/>
    </marker>
  </defs>

  <rect class="paper" x="0" y="0" width="560" height="900"/>

  <!-- header -->
  <text class="h ink" x="28" y="40" font-size="22" font-weight="700">One engine, one shared state</text>
  <text class="l mut" x="28" y="62" font-size="13">The intelligence oracle as a LangGraph StateGraph — 10 nodes over one typed record</text>

  <!-- START -->
  <rect class="soft" x="248" y="86" width="64" height="26" rx="13"/>
  <text class="l acc" x="280" y="103" font-size="12" font-weight="700" text-anchor="middle">START</text>
  <path class="flow" d="M280 112 L280 132" marker-end="url(#aha)"/>

  <!-- Assemble state -->
  <rect class="card" x="160" y="134" width="240" height="46" rx="10"/>
  <text class="h ink" x="280" y="158" font-size="15" font-weight="600" text-anchor="middle">Assemble state</text>
  <text class="l mut" x="280" y="173" font-size="11" text-anchor="middle">board, actors, initial belief</text>

  <!-- fan-out arrows -->
  <text class="l acc" x="280" y="200" font-size="11" font-style="italic" text-anchor="middle">parallel branch — run at once</text>
  <path class="flow" d="M245 180 L160 210" marker-end="url(#aha)"/>
  <path class="flow" d="M315 180 L400 210" marker-end="url(#aha)"/>

  <!-- fan-out nodes -->
  <rect class="card" x="44" y="212" width="214" height="46" rx="10"/>
  <text class="h ink" x="151" y="236" font-size="14" font-weight="600" text-anchor="middle">Intel network</text>
  <text class="l mut" x="151" y="251" font-size="11" text-anchor="middle">NetworkX graph analysis</text>

  <rect class="card" x="302" y="212" width="214" height="46" rx="10"/>
  <text class="h ink" x="409" y="236" font-size="14" font-weight="600" text-anchor="middle">Coalition</text>
  <text class="l mut" x="409" y="251" font-size="11" text-anchor="middle">NetworkX graph analysis</text>

  <!-- fan-in arrows -->
  <path class="flow" d="M151 258 L250 296" marker-end="url(#aha)"/>
  <path class="flow" d="M409 258 L310 296" marker-end="url(#aha)"/>

  <!-- Belief estimate -->
  <rect class="card" x="160" y="298" width="240" height="46" rx="10"/>
  <text class="h ink" x="280" y="322" font-size="15" font-weight="600" text-anchor="middle">Belief estimate</text>
  <text class="l mut" x="280" y="337" font-size="11" text-anchor="middle">probability over world states</text>

  <!-- fan-in / reducer callout (right) -->
  <path class="edge" d="M400 316 L420 316" />
  <rect class="soft" x="420" y="292" width="130" height="58" rx="8"/>
  <text class="l acc" x="428" y="308" font-size="11" font-weight="700">fan-in barrier</text>
  <text class="l mut" x="428" y="322" font-size="10.5">both branches merge;</text>
  <text class="l mut" x="428" y="335" font-size="10.5">shared error + warn</text>
  <text class="l mut" x="428" y="348" font-size="10.5">lists use append reducer</text>

  <!-- spine -->
  <path class="edge" d="M280 344 L280 366" marker-end="url(#ah)"/>
  <rect class="card" x="160" y="368" width="240" height="42" rx="10"/>
  <text class="h ink" x="280" y="390" font-size="14" font-weight="600" text-anchor="middle">Value of Information</text>
  <text class="l mut" x="280" y="404" font-size="10.5" text-anchor="middle">which intel to gather next</text>

  <path class="edge" d="M280 410 L280 430" marker-end="url(#ah)"/>
  <rect class="card" x="160" y="432" width="240" height="42" rx="10"/>
  <text class="h ink" x="280" y="454" font-size="14" font-weight="600" text-anchor="middle">Adversary</text>
  <text class="l mut" x="280" y="468" font-size="10.5" text-anchor="middle">Stackelberg model</text>

  <path class="edge" d="M280 474 L280 494" marker-end="url(#ah)"/>
  <rect class="card" x="160" y="496" width="240" height="42" rx="10"/>
  <text class="h ink" x="280" y="518" font-size="14" font-weight="600" text-anchor="middle">Strategy</text>
  <text class="l mut" x="280" y="532" font-size="10.5" text-anchor="middle">POMDP planner over belief</text>

  <path class="edge" d="M280 538 L280 558" marker-end="url(#ah)"/>
  <rect class="card" x="160" y="560" width="240" height="42" rx="10"/>
  <text class="h ink" x="280" y="582" font-size="14" font-weight="600" text-anchor="middle">Critical path</text>
  <text class="l mut" x="280" y="596" font-size="10.5" text-anchor="middle">CPM / PERT scheduler</text>

  <path class="edge" d="M280 602 L280 622" marker-end="url(#ah)"/>
  <rect class="card" x="160" y="624" width="240" height="42" rx="10"/>
  <text class="h ink" x="280" y="646" font-size="14" font-weight="600" text-anchor="middle">Simulator</text>
  <text class="l mut" x="280" y="660" font-size="10.5" text-anchor="middle">Monte Carlo</text>

  <!-- conditional fork -->
  <path class="flow" d="M280 666 L280 690" marker-end="url(#aha)"/>
  <path class="edge" d="M258 706 L280 690 L302 706 L280 722 Z" fill="#ffffff"/>
  <text class="l mut" x="280" y="710" font-size="10" text-anchor="middle">error?</text>

  <!-- error branch to END (right) -->
  <path class="edge" d="M302 706 L432 706" marker-end="url(#ah)"/>
  <text class="l mut" x="360" y="700" font-size="10" text-anchor="middle">on error</text>
  <rect class="soft" x="434" y="693" width="60" height="26" rx="13"/>
  <text class="l acc" x="464" y="710" font-size="12" font-weight="700" text-anchor="middle">END</text>

  <!-- fork callout (left) -->
  <rect class="soft" x="20" y="688" width="132" height="44" rx="8"/>
  <text class="l acc" x="28" y="704" font-size="11" font-weight="700">conditional fork</text>
  <text class="l mut" x="28" y="718" font-size="10.5">skip narration when</text>
  <text class="l mut" x="28" y="730" font-size="10.5">a step failed fatally</text>

  <!-- ok branch to narrate -->
  <path class="flow" d="M280 722 L280 748" marker-end="url(#aha)"/>
  <text class="l mut" x="296" y="740" font-size="10">ok</text>
  <rect class="card" x="160" y="750" width="240" height="46" rx="10"/>
  <text class="h ink" x="280" y="774" font-size="15" font-weight="600" text-anchor="middle">Narrate</text>
  <text class="l mut" x="280" y="789" font-size="11" text-anchor="middle">Claude turns numbers into prose</text>

  <path class="flow" d="M280 796 L280 818" marker-end="url(#aha)"/>
  <rect class="soft" x="248" y="820" width="64" height="26" rx="13"/>
  <text class="l acc" x="280" y="837" font-size="12" font-weight="700" text-anchor="middle">END</text>

  <!-- footer note -->
  <text class="l mut" x="28" y="878" font-size="11">State is snapshotted at each boundary — a long run resumes after a crash, or pauses for a human at the fork.</text>
</svg>
