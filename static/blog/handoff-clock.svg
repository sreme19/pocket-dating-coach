<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" width="560" height="620" role="img" aria-labelledby="hct hcd">
  <title id="hct">The 48-hour hand-off clock, and what happens at each point</title>
  <desc id="hcd">A timeline from zero to thirty days. At hour zero the agent wraps up and hands the conversation to the woman. At twenty-four hours she is nudged. At forty-five hours she is nudged again, more directly. At forty-eight hours the match expires: it is marked expired rather than deleted, the man is offered a replacement, and she keeps a button to bring it back. At thirty days the expired record is finally purged. A branch shows that if she sends the agent back with more questions, the wrap timestamp is cleared, which is what suspends the clock.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .hot { fill: #f6ece4; stroke: #b4541e; stroke-width: 1.5; }
    .rail { stroke: #e8e3d8; stroke-width: 2; fill: none; }
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #b4541e; }
    .h { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 15px; fill: #17161b; }
    .s { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
    .dot { fill: #b4541e; }
    .dotg { fill: #c9c4bb; }
    .branch { stroke: #b4541e; stroke-width: 1.5; fill: none; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }

    @media (prefers-reduced-motion: no-preference) {
      .rail { stroke-dasharray: 5 5; animation: fl-rail 1.1s linear infinite; }
      .branch { stroke-dasharray: 5 4; animation: fl-branch 0.9s linear infinite; }
    }
    @keyframes fl-rail { to { stroke-dashoffset: -10; } }
    @keyframes fl-branch { to { stroke-dashoffset: -9; } }
  </style>
  <rect class="bg" width="560" height="620" rx="8"/>
  <path class="rail" d="M70 44 L70 470"/>
  <circle class="dot" cx="70" cy="58" r="6"/>
  <text class="t" x="96" y="40">HOUR 0</text>
  <rect class="card" x="96" y="48" width="440" height="66" rx="6"/>
  <text class="h" x="116" y="74">The agent wraps up</text>
  <text class="s" x="116" y="96">It has finished vetting. The conversation is handed to her.</text>
  <circle class="dotg" cx="70" cy="152" r="6"/>
  <text class="t" x="96" y="134">HOUR 24</text>
  <rect class="card" x="96" y="142" width="440" height="56" rx="6"/>
  <text class="h" x="116" y="168">First nudge</text>
  <text class="s" x="116" y="188">A reminder that someone is waiting on her</text>
  <circle class="dotg" cx="70" cy="236" r="6"/>
  <text class="t" x="96" y="218">HOUR 45</text>
  <rect class="card" x="96" y="226" width="440" height="56" rx="6"/>
  <text class="h" x="116" y="252">Second nudge</text>
  <text class="s" x="116" y="272">Three hours left, and it says so</text>
  <circle class="dot" cx="70" cy="330" r="7"/>
  <text class="t" x="96" y="312">HOUR 48</text>
  <rect class="hot" x="96" y="320" width="440" height="88" rx="6"/>
  <text class="h" x="116" y="346">Expires — but nothing is deleted</text>
  <text class="s" x="116" y="368">Marked expired · he is offered a replacement match</text>
  <text class="s" x="116" y="388">She keeps a button that brings it back</text>
  <circle class="dotg" cx="70" cy="446" r="6"/>
  <text class="t" x="96" y="428">DAY 30</text>
  <rect class="card" x="96" y="436" width="440" height="56" rx="6"/>
  <text class="h" x="116" y="462">Purged</text>
  <text class="s" x="116" y="482">Only now is the record actually removed</text>
  <path class="branch" d="M70 470 L70 528 L120 528" marker-end="url(#hh)"/>
  <rect class="card" x="128" y="502" width="408" height="56" rx="6"/>
  <text class="h" x="148" y="528">She sends the agent back instead</text>
  <text class="s" x="148" y="548">The wrap timestamp is cleared — which is what stops the clock</text>
  <text class="foot" x="280" y="596" text-anchor="middle">There is no separate pause flag that could disagree with the clock.</text>
  <defs>
    <marker id="hh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4541e"/>
    </marker>
  </defs>
</svg>
