<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 486" width="560" height="486" role="img" aria-labelledby="lst lsd">
  <title id="lst">The answer ledger schema, and the two columns deliberately absent from it</title>
  <desc id="lsd">The ledger table holds five columns: who said it, the canonical topic key, the verbatim answer, when it was captured, and a staleness timestamp. Two further columns are shown crossed out and greyed: the match it came from, and the counterparty it was said to. Neither exists in the table. Because no row records its origin, no answer can be attributed back to a specific conversation, even by someone with full database access.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.07em; fill: #6e6a63; }
    .col { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; fill: #17161b; }
    .colx { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; fill: #b9b4ab; }
    .d { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
    .dx { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #b9b4ab; }
    .strike { stroke: #b4541e; stroke-width: 1.6; }
    .note { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: #b4541e; font-weight: 600; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6e6a63; }
  </style>
  <rect class="bg" width="560" height="486" rx="8"/>
  <text class="hdr" x="40" y="34">COLUMNS THAT EXIST</text>
  <rect class="card" x="30" y="46" width="500" height="196" rx="6"/>
  <text class="col" x="48" y="74">user_id</text>
  <text class="d" x="230" y="74">who said it</text>
  <text class="col" x="48" y="108">topic</text>
  <text class="d" x="230" y="108">canonical key, shared across threads</text>
  <text class="col" x="48" y="142">answer</text>
  <text class="d" x="230" y="142">his words, verbatim</text>
  <text class="col" x="48" y="176">captured_at</text>
  <text class="d" x="230" y="176">when he said it</text>
  <text class="col" x="48" y="210">last_confirmed</text>
  <text class="d" x="230" y="210">drives the staleness window</text>
  <text class="hdr" x="40" y="288">COLUMNS THAT DO NOT</text>
  <rect x="30" y="300" width="500" height="88" rx="6" fill="#ffffff" stroke="#e8e3d8" stroke-dasharray="5 4"/>
  <text class="colx" x="48" y="330">match_id</text>
  <text class="dx" x="230" y="330">which conversation it came from</text>
  <line class="strike" x1="44" y1="326" x2="196" y2="326"/>
  <text class="colx" x="48" y="366">partner_id</text>
  <text class="dx" x="230" y="366">who he was talking to at the time</text>
  <line class="strike" x1="44" y1="362" x2="196" y2="362"/>
  <text class="note" x="280" y="424" text-anchor="middle">A column that does not exist cannot leak.</text>
  <text class="foot" x="280" y="450" text-anchor="middle">No row records its own origin, so no answer can be traced</text>
  <text class="foot" x="280" y="468" text-anchor="middle">back to a conversation — not even with full database access.</text>
</svg>
