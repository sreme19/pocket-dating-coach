<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="lst lsd">
  <title id="lst">Three layers stacked: Postgres, pgvector, Neo4j, one question passing through all three</title>
  <desc id="lsd">Relational Postgres sits at the base holding the ledger of matches and trust events. pgvector sits in the middle, retrieving grounding text by similarity. Neo4j sits on top, walking the multi-hop chain a single row cannot express. One question — why did this handoff go quiet — passes up through all three layers before a model narrates the combined answer.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .src { fill: #f6ece4; stroke: #b4541e; stroke-width: 1.4; }
    .w { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; fill: #b4541e; }
    .h { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 13px; fill: #17161b; }
    .s { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #6e6a63; }
    .arrow { stroke: #97928a; stroke-width: 1.5; fill: none; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
    @media (prefers-reduced-motion: no-preference) {
      .arrow { stroke-dasharray: 4 4; animation: fl 0.9s linear infinite; }
    }
    @keyframes fl { to { stroke-dashoffset: -8; } }
  </style>

  <rect class="bg" width="560" height="480" rx="8"/>

  <!-- question -->
  <rect class="src" x="130" y="16" width="300" height="44" rx="6"/>
  <text class="h" x="280" y="42" text-anchor="middle">"Why did this handoff go quiet?"</text>

  <path class="arrow" d="M280 60 L280 78" marker-end="url(#a)"/>

  <!-- layer 3: graph, top -->
  <rect class="card" x="40" y="80" width="480" height="90" rx="6"/>
  <text class="w" x="60" y="100">LAYER 3 — GRAPH (Neo4j)</text>
  <text class="h" x="60" y="118">Walks the exact match → handoff → trust → replacement chain</text>
  <text class="s" x="60" y="136">Answers: why, specifically, for this one pair</text>
  <text class="s" x="60" y="152">Built only once this question shape existed</text>

  <path class="arrow" d="M280 170 L280 188" marker-end="url(#a)"/>

  <!-- layer 2: vector, middle -->
  <rect class="card" x="40" y="190" width="480" height="90" rx="6"/>
  <text class="w" x="60" y="210">LAYER 2 — VECTOR (pgvector, HNSW)</text>
  <text class="h" x="60" y="228">Retrieves grounding text by similarity, in parallel</text>
  <text class="s" x="60" y="246">Answers: what advice reads like this situation</text>
  <text class="s" x="60" y="262">Cannot answer why — no embedding of a sequence exists</text>

  <path class="arrow" d="M280 280 L280 298" marker-end="url(#a)"/>

  <!-- layer 1: relational, base -->
  <rect class="src" x="40" y="300" width="480" height="90" rx="6"/>
  <text class="w" x="60" y="320">LAYER 1 — RELATIONAL (Postgres)</text>
  <text class="h" x="60" y="338">Ledger of record both layers above read from</text>
  <text class="s" x="60" y="356">Holds every fact; answers no unanticipated question alone</text>
  <text class="s" x="60" y="372">Both layers above are derived views, never a second ledger</text>

  <path class="arrow" d="M280 390 L280 408" marker-end="url(#a)"/>

  <!-- model -->
  <rect class="card" x="140" y="410" width="280" height="42" rx="6"/>
  <text class="h" x="280" y="436" text-anchor="middle">Model narrates — never computes — the combined facts</text>

  <text class="foot" x="280" y="470" text-anchor="middle">Three distinct questions answered in one turn, not one richer answer to one question.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#97928a"/>
    </marker>
  </defs>
</svg>
