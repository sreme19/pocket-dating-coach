<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" width="560" height="490" role="img" aria-labelledby="cat cad">
  <title id="cat">Context assembly: retrieve from multiple sources, rank, then assemble the window</title>
  <desc id="cad">A user query is embedded, then three retrieval paths run in parallel: vector search using pgvector, Qdrant, Pinecone, Weaviate or Milvus; keyword search using BM25 with hybrid retrieval; and graph traversal using Neo4j or Neptune. Results converge into reciprocal rank fusion and a reranker. The ranked material enters window assembly, where four operations — compress, isolate, trim, filter — shape what enters the context window. A semantic or ontology layer grounds the volatile parts. The assembled context plus the instruction go to the model. The hard part is relevance, not plumbing.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .src { fill: #f6ece4; stroke: #b4541e; stroke-width: 1.4; }
    .op { fill: #f6ece4; stroke: #b4541e; stroke-width: 1; rx: 4; }
    .w { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; fill: #b4541e; }
    .h { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 14px; fill: #17161b; }
    .s { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6e6a63; }
    .arrow { stroke: #97928a; stroke-width: 1.5; fill: none; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
    @media (prefers-reduced-motion: no-preference) {
      .arrow { stroke-dasharray: 4 4; animation: fl 0.9s linear infinite; }
    }
    @keyframes fl { to { stroke-dashoffset: -8; } }
  </style>

  <rect class="bg" width="560" height="490" rx="8"/>

  <!-- User query -->
  <rect class="src" x="170" y="18" width="220" height="36" rx="6"/>
  <text class="h" x="280" y="42" text-anchor="middle">User query</text>

  <!-- Arrow: query → embed -->
  <path class="arrow" d="M280 54 L280 70" marker-end="url(#a)"/>

  <!-- EMBED -->
  <rect class="card" x="140" y="72" width="280" height="38" rx="6"/>
  <text class="w" x="160" y="90">EMBED</text>
  <text class="h" x="160" y="104">Embedding model</text>

  <!-- Fan-out arrows to three retrieval boxes -->
  <path class="arrow" d="M280 110 L116 130" marker-end="url(#a)"/>
  <path class="arrow" d="M280 110 L280 130" marker-end="url(#a)"/>
  <path class="arrow" d="M280 110 L444 130" marker-end="url(#a)"/>

  <!-- VECTOR -->
  <rect class="card" x="42" y="132" width="148" height="68" rx="6"/>
  <text class="w" x="58" y="150">VECTOR</text>
  <text class="s" x="58" y="166">pgvector · Qdrant</text>
  <text class="s" x="58" y="180">Pinecone · Weaviate</text>
  <text class="s" x="58" y="194">Milvus</text>

  <!-- KEYWORD -->
  <rect class="card" x="206" y="132" width="148" height="68" rx="6"/>
  <text class="w" x="222" y="150">KEYWORD</text>
  <text class="s" x="222" y="166">BM25</text>
  <text class="s" x="222" y="180">Hybrid search</text>

  <!-- GRAPH -->
  <rect class="card" x="370" y="132" width="148" height="68" rx="6"/>
  <text class="w" x="386" y="150">GRAPH</text>
  <text class="s" x="386" y="166">Neo4j · Neptune</text>
  <text class="s" x="386" y="180">MCP for external APIs</text>

  <!-- Fan-in arrows to RANK -->
  <path class="arrow" d="M116 200 L280 220" marker-end="url(#a)"/>
  <path class="arrow" d="M280 200 L280 220" marker-end="url(#a)"/>
  <path class="arrow" d="M444 200 L280 220" marker-end="url(#a)"/>

  <!-- RANK -->
  <rect class="card" x="40" y="222" width="480" height="40" rx="6"/>
  <text class="w" x="60" y="240">RANK</text>
  <text class="h" x="60" y="256">Reciprocal rank fusion · Reranker</text>

  <!-- Arrow: RANK → ASSEMBLE -->
  <path class="arrow" d="M280 262 L280 280" marker-end="url(#a)"/>

  <!-- ASSEMBLE WINDOW (accent container) -->
  <rect class="src" x="24" y="282" width="512" height="76" rx="6"/>
  <text class="w" x="44" y="300">ASSEMBLE WINDOW</text>

  <!-- Four window operations as inner boxes -->
  <rect class="op" x="44" y="306" width="104" height="24" rx="4"/>
  <text class="w" x="96" y="322" text-anchor="middle">COMPRESS</text>
  <rect class="op" x="160" y="306" width="96" height="24" rx="4"/>
  <text class="w" x="208" y="322" text-anchor="middle">ISOLATE</text>
  <rect class="op" x="268" y="306" width="80" height="24" rx="4"/>
  <text class="w" x="308" y="322" text-anchor="middle">TRIM</text>
  <rect class="op" x="360" y="306" width="88" height="24" rx="4"/>
  <text class="w" x="404" y="322" text-anchor="middle">FILTER</text>

  <text class="s" x="44" y="348" style="fill:#b4541e">Semantic or ontology layer for grounding</text>

  <!-- Arrow: ASSEMBLE → output -->
  <path class="arrow" d="M280 358 L280 376" marker-end="url(#a)"/>

  <!-- Output -->
  <rect class="card" x="110" y="378" width="340" height="36" rx="6"/>
  <text class="h" x="280" y="402" text-anchor="middle">Context window + instruction → Model</text>

  <!-- Footer -->
  <text class="foot" x="280" y="446" text-anchor="middle">The hard part is relevance, not plumbing.</text>
  <text class="foot" x="280" y="464" text-anchor="middle">Still one model call — the cost is a longer prompt.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#97928a"/>
    </marker>
  </defs>
</svg>
