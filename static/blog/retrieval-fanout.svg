<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 806" width="560" height="806" role="img" aria-labelledby="rfot rfod">
  <title id="rfot">One question that needs all three stores, and the fused context that reaches the model</title>
  <desc id="rfod">A single question arrives that no one store answers on its own: is this company worth approaching, and through whom. The routing layer splits it into three sub-questions before anything is searched, because each one is a different shape of answer. The narrative sub-question — which of my own proof points speaks to their problem — goes to the meaning-search index, a 384-dimension BGE-small model over a plain array. The quantity sub-question — how many companies at this stage have replied before — goes to DuckDB, roughly 190 tables across two database files. The relationship sub-question — who do I already know one hop from this company — goes to Kuzu, an embedded graph database with real Cypher. The three result sets meet in a context-fusion step that de-duplicates them, tags each fact with the store it came from, and applies the sensitivity and provenance filters as a mask before ranking rather than as a pass afterwards. Only then does a model run: Claude Opus 5 over the fused context, doing reasoning and synthesis rather than search. The output is a draft in a plain text file, which a person sends themselves. The footer records the economics: three retrievals, none of them metered, and one model call on a context a fraction the size of the documents the facts came from.</desc>
  <style>
