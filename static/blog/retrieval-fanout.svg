  <rect class="hot" x="24" y="30" width="512" height="82" rx="6"/>
  <text class="kb" x="42" y="52">ONE QUESTION, THREE SHAPES OF ANSWER</text>
  <text class="hq" x="42" y="76">“Is this company worth approaching,</text>
  <text class="hq" x="42" y="98">and through whom?”</text>

  <line class="arrow" x1="280" y1="112" x2="280" y2="134" marker-end="url(#rf)"/>

  <rect class="card" x="24" y="138" width="512" height="64" rx="6"/>
  <text class="k" x="42" y="160">SPLIT BEFORE ANYTHING IS SEARCHED</text>
  <text class="h" x="42" y="182">Three sub-questions, three stores</text>
  <text class="cap" x="516" y="182" text-anchor="end">no model yet</text>

  <path class="arrow" d="M 280 202 V 226 H 105 V 258" marker-end="url(#rf)"/>
  <path class="arrow" d="M 280 202 V 258" marker-end="url(#rf)"/>
  <path class="arrow" d="M 280 202 V 226 H 455 V 258" marker-end="url(#rf)"/>
  <text class="el" x="186" y="220" text-anchor="middle">narrative</text>
  <text class="el" x="290" y="248">quantity</text>
  <text class="el" x="372" y="220" text-anchor="middle">relationship</text>

  <rect class="card" x="24" y="262" width="162" height="152" rx="6"/>
  <text class="k" x="42" y="282">PROSE</text>
  <text class="h" x="42" y="304">Meaning search</text>
  <text class="s" x="42" y="324">BGE-small, 384 dims</text>
  <line class="rule" x1="42" y1="338" x2="168" y2="338"/>
  <text class="q" x="42" y="358">which proof point</text>
  <text class="q" x="42" y="376">of mine speaks to</text>
  <text class="q" x="42" y="394">their problem</text>

  <rect class="card" x="199" y="262" width="162" height="152" rx="6"/>
  <text class="k" x="217" y="282">GRIDS</text>
  <text class="h" x="217" y="304">DuckDB</text>
  <text class="s" x="217" y="324">~190 tables, two files</text>
  <line class="rule" x1="217" y1="338" x2="343" y2="338"/>
  <text class="q" x="217" y="358">how many companies</text>
  <text class="q" x="217" y="376">at this stage have</text>
  <text class="q" x="217" y="394">replied before</text>

  <rect class="card" x="374" y="262" width="162" height="152" rx="6"/>
  <text class="k" x="392" y="282">RELATIONSHIPS</text>
  <text class="h" x="392" y="304">Kuzu</text>
  <text class="s" x="392" y="324">Embedded, real Cypher</text>
  <line class="rule" x1="392" y1="338" x2="518" y2="338"/>
  <text class="q" x="392" y="358">who do I already</text>
  <text class="q" x="392" y="376">know one hop from</text>
  <text class="q" x="392" y="394">this company</text>

  <line class="arrow" x1="105" y1="416" x2="105" y2="436"/>
  <line class="arrow" x1="280" y1="416" x2="280" y2="436"/>
  <line class="arrow" x1="455" y1="416" x2="455" y2="436"/>
  <line class="bar" x1="105" y1="436" x2="455" y2="436"/>
  <line class="arrow" x1="280" y1="436" x2="280" y2="464" marker-end="url(#rf)"/>

  <rect class="card" x="24" y="468" width="512" height="86" rx="6"/>
  <text class="k" x="42" y="490">CONTEXT FUSION</text>
  <text class="h" x="42" y="512">De-duplicated, each fact tagged with its store</text>
  <text class="s" x="42" y="532">Sensitivity and provenance applied as a mask before ranking,</text>
  <text class="s" x="42" y="546">never as a pass over the results afterwards</text>

  <line class="arrow" x1="280" y1="554" x2="280" y2="576" marker-end="url(#rf)"/>

  <rect class="card" x="24" y="580" width="512" height="82" rx="6"/>
  <text class="k" x="42" y="602">THE ONLY METERED STEP</text>
  <text class="h" x="42" y="624">Claude Opus 5, Messages API</text>
  <text class="s" x="42" y="644">Reasoning and synthesis — where a model earns its cost</text>

  <line class="arrow" x1="280" y1="662" x2="280" y2="684" marker-end="url(#rf)"/>

  <rect class="final" x="24" y="688" width="512" height="56" rx="6"/>
  <text class="kb" x="42" y="710">THE OUTPUT</text>
  <text class="h" x="42" y="732">A draft in a plain text file, sent by a person</text>

  <text class="foot" x="280" y="782" text-anchor="middle">Three retrievals, none metered. One model call, on a fraction of the context.</text>
</svg>
