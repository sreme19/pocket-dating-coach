<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-labelledby="fbt fbd">
  <title id="fbt">Comparing three models fairly by retrieving once</title>
  <desc id="fbd">A question is asked once. Retrieval runs once, producing a single set of context chunks. That identical context is then fanned out to three different models in parallel, and their answers come back side by side. Because every model saw exactly the same context, any difference in the answers is caused by the model and not by the retriever. Retrieving separately per model would confound the two, which is how most informal comparisons go wrong.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .shared { fill: #f2f6f3; stroke: #2f6b46; stroke-width: 1.4; }
    .m { fill: #f6ece4; stroke: #b4541e; stroke-width: 1.3; }
    .h { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 13.5px; fill: #17161b; }
    .s { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6e6a63; }
    .k { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; fill: #2f6b46; }
    .arrow { stroke: #97928a; stroke-width: 1.4; fill: none; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
    @media (prefers-reduced-motion: no-preference) {
      .arrow { stroke-dasharray: 4 4; animation: fl-fb 0.9s linear infinite; }
    }
    @keyframes fl-fb { to { stroke-dashoffset: -8; } }
  </style>
  <rect class="bg" width="560" height="470" rx="8"/>
  <rect class="card" x="180" y="20" width="200" height="42" rx="6"/>
  <text class="h" x="280" y="46" text-anchor="middle">One question</text>
  <path class="arrow" d="M280 62 L280 88" marker-end="url(#fb)"/>
  <rect class="shared" x="130" y="92" width="300" height="60" rx="6"/>
  <text class="k" x="150" y="114">RETRIEVED ONCE</text>
  <text class="h" x="150" y="136">The same context for all three</text>
  <path class="arrow" d="M220 152 L110 196" marker-end="url(#fb)"/>
  <path class="arrow" d="M280 152 L280 196" marker-end="url(#fb)"/>
  <path class="arrow" d="M340 152 L450 196" marker-end="url(#fb)"/>
  <rect class="m" x="24" y="200" width="150" height="56" rx="6"/>
  <text class="h" x="99" y="224" text-anchor="middle">A small model</text>
  <text class="s" x="99" y="244" text-anchor="middle">cheapest</text>
  <rect class="m" x="205" y="200" width="150" height="56" rx="6"/>
  <text class="h" x="280" y="224" text-anchor="middle">A larger model</text>
  <text class="s" x="280" y="244" text-anchor="middle">~4x the cost</text>
  <rect class="m" x="386" y="200" width="150" height="56" rx="6"/>
  <text class="h" x="461" y="224" text-anchor="middle">A third model</text>
  <text class="s" x="461" y="244" text-anchor="middle">different vendor</text>
  <path class="arrow" d="M99 256 L200 300" marker-end="url(#fb)"/>
  <path class="arrow" d="M280 256 L280 300" marker-end="url(#fb)"/>
  <path class="arrow" d="M461 256 L360 300" marker-end="url(#fb)"/>
  <rect class="card" x="130" y="304" width="300" height="56" rx="6"/>
  <text class="h" x="280" y="328" text-anchor="middle">Three answers, side by side</text>
  <text class="s" x="280" y="348" text-anchor="middle">with the cost of each</text>
  <rect class="card" x="24" y="392" width="512" height="60" rx="6"/>
  <text class="foot" x="280" y="418" text-anchor="middle">Retrieve separately per model and you are comparing two things at once.</text>
  <text class="foot" x="280" y="438" text-anchor="middle">Retrieve once and the only variable left is the model.</text>
  <defs>
    <marker id="fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#97928a"/>
    </marker>
  </defs>
</svg>
