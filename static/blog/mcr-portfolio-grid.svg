<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640" role="img" aria-labelledby="mgt mgd">
  <title id="mgt">Thirteen systems sorted by layer</title>
  <desc id="mgd">A grid of thirteen systems against four columns: reason, code, math and a person. A filled dot means that column owns the system's key step; a ring means it supports. Math owns the key step in the IPL XI optimizer, the women's T20 oracle, the spy-thriller oracle, the Game of Thrones oracle and the dating matchmaker, with the model only narrating or reading. Code owns it in the dating reply agent, the clinic chatbot, the weekly profitability report, the lead-routing editor, the ad-operations agent, the graph retrieval demo and the call-compliance detectors. The model owns a key step only where it writes something a person reads: the dating reply agent, the clinic chatbot, the job-search agent and the ad-operations agent, and in each of those code or a person stands after it. A person keeps the final call in the lead-routing editor, the job-search agent and the ad-operations agent. The call-compliance detectors use code alone.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .zebra { fill: #ffffff; }
    .t { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 18px; fill: #17161b; }
    .n { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 13.5px; fill: #17161b; }
    .k { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #6e6a63; }
    .ch { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6e6a63; }
    .rule { stroke: #e8e3d8; stroke-width: 1; }
  </style>
