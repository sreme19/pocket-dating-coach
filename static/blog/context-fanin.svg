<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 680" width="560" height="680" role="img" aria-labelledby="cft cfd">
  <title id="cft">What is loaded before the agent writes a single word</title>
  <desc id="cfd">Six groups of context are read in parallel and merged into one system prompt. Who he is: profile, verified proofs and chat artifacts, each trimmed to 240 characters. Who is interested: the last ten admirers. His matches: ten loaded, the top six hydrated, six messages each. Live standing: pool counts and trust rank, computed in SQL rather than by a model. Cross-thread memory: at most twelve ledger entries. This conversation: the last twelve messages. Every limit is a row count or a string length. Nothing counts tokens.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .final { fill: #f6ece4; stroke: #b4541e; stroke-width: 1.5; }
    .h { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 14.5px; fill: #17161b; }
    .s { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
    .cap { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #b4541e; }
    .arrow { stroke: #97928a; stroke-width: 1.4; fill: none; }
    .k { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; fill: #97928a; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
  </style>
  <rect class="bg" width="560" height="680" rx="8"/>
  <text class="k" x="30" y="28">READ IN PARALLEL, EVERY SINGLE TURN</text>
  <rect class="card" x="24" y="40" width="512" height="60" rx="6"/>
  <text class="h" x="42" y="66">Who he is</text>
  <text class="s" x="42" y="86">Profile, verified proofs, chat artifacts</text>
  <text class="cap" x="516" y="76" text-anchor="end">240 chars each</text>
  <rect class="card" x="24" y="108" width="512" height="60" rx="6"/>
  <text class="h" x="42" y="134">Who is interested in him</text>
  <text class="s" x="42" y="154">Recent admirers, newest first</text>
  <text class="cap" x="516" y="144" text-anchor="end">last 10</text>
  <rect class="card" x="24" y="176" width="512" height="60" rx="6"/>
  <text class="h" x="42" y="202">His matches</text>
  <text class="s" x="42" y="222">Loaded, then the strongest are hydrated with detail</text>
  <text class="cap" x="516" y="212" text-anchor="end">10 → top 6</text>
  <rect class="card" x="24" y="244" width="512" height="60" rx="6"/>
  <text class="h" x="42" y="270">Where he stands right now</text>
  <text class="s" x="42" y="290">Live pool counts and trust rank, computed in SQL</text>
  <text class="cap" x="516" y="280" text-anchor="end">no model</text>
  <rect class="card" x="24" y="312" width="512" height="60" rx="6"/>
  <text class="h" x="42" y="338">What he told other agents</text>
  <text class="s" x="42" y="358">The answer ledger, consent permitting</text>
  <text class="cap" x="516" y="348" text-anchor="end">max 12 entries</text>
  <rect class="card" x="24" y="380" width="512" height="60" rx="6"/>
  <text class="h" x="42" y="406">This conversation</text>
  <text class="s" x="42" y="426">The transcript window</text>
  <text class="cap" x="516" y="416" text-anchor="end">last 12 messages</text>
  <path class="arrow" d="M280 440 L280 476" marker-end="url(#c)"/>
  <rect class="final" x="24" y="480" width="512" height="72" rx="6"/>
  <text class="h" x="280" y="510" text-anchor="middle">One system prompt, assembled per turn</text>
  <text class="s" x="280" y="532" text-anchor="middle">Claude Sonnet 4.5 sees this and nothing else</text>
  <rect x="24" y="576" width="512" height="88" rx="6" fill="#ffffff" stroke="#e8e3d8"/>
  <text class="foot" x="280" y="604" text-anchor="middle">Every limit above is a row count or a string length.</text>
  <text class="foot" x="280" y="626" text-anchor="middle">Nothing in this pipeline counts a token, estimates a cost,</text>
  <text class="foot" x="280" y="648" text-anchor="middle">or decides what to drop when the window gets tight.</text>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#97928a"/>
    </marker>
  </defs>
</svg>
