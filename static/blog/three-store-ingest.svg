<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 566" width="560" height="566"
     role="img" aria-labelledby="tsi-title tsi-desc">
  <title id="tsi-title">Splitting one archive into three stores by shape</title>
  <desc id="tsi-desc">One archive of about 1,100 work documents, four of them 230 to 270 printed pages each, is classified once by shape before anything is indexed. The decision is made per file and is about form rather than subject matter. A fourth group, source code, media, and financial and identity documents, is indexed nowhere at all. Prose, meaning meeting notes, strategy documents and research logs, is split into passages and then into 120-token windows, with each document's title indexed alongside its passages, and embedded by a 384-dimension BGE-small model running through ONNX on the CPU into a local embedding index of 11,621 passages and 54,459 windows. Grids, meaning spreadsheets and exported tables, have their header row detected and every column loaded as text to be cast at query time, into DuckDB, 8,927 tables drawn from 3,470 workbooks. Relationships, meaning companies, people and investors, are parsed from records that already exist and never inferred by a model, into Kuzu, an embedded graph database of node tables and relationship tables queried with real Cypher. Sensitivity is a separate label applied when a query runs, not something implied by which store a file landed in.</desc>

  <defs>
    <marker id="tsi-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6a63"/>
    </marker>
    <style>
      .t  { font-family: system-ui, -apple-system, sans-serif; fill: #17161b; }
      .m  { font-family: system-ui, -apple-system, sans-serif; fill: #6e6a63; }
      .cap{ font-family: system-ui, -apple-system, sans-serif; fill: #6e6a63;
            font-size: 9.5px; font-weight: 700; letter-spacing: 0.09em; }
      .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
      .flow { fill: none; stroke-width: 2; stroke-dasharray: 7 5; }
      @media (prefers-reduced-motion: no-preference) {
        .flow { animation: tsi-march 1.1s linear infinite; }
      }
      @keyframes tsi-march { to { stroke-dashoffset: -12; } }
    </style>
  </defs>

  <rect width="560" height="566" fill="#fcfbf8"/>

  <!-- archive -->
  <rect class="card" x="28" y="24" width="504" height="58" rx="6"/>
  <text class="cap" x="44" y="45">ONE ARCHIVE</text>
  <text class="m" x="44" y="67" font-size="12">~1,100 documents. Four of them run 230–270 printed pages each.</text>
  <path class="flow" d="M 280 82 L 280 100" stroke="#6e6a63" marker-end="url(#tsi-a)"/>

  <!-- classify -->
  <rect class="card" x="28" y="106" width="504" height="88" rx="6" stroke="#b4541e"/>
  <text class="cap" x="44" y="127" fill="#b4541e">CLASSIFIED BY SHAPE, NOT BY SUBJECT</text>
  <text class="t" x="44" y="149" font-size="11.5">One decision per file, made once, before anything is indexed.</text>
  <text class="m" x="44" y="168" font-size="11.5">A fourth group is indexed nowhere at all: source code, media,</text>
  <text class="m" x="44" y="184" font-size="11.5">and financial or identity documents.</text>

  <!-- fan out -->
  <path class="flow" d="M 108 194 L 108 250" stroke="#6e6a63" marker-end="url(#tsi-a)"/>
  <path class="flow" d="M 280 194 L 280 250" stroke="#6e6a63" marker-end="url(#tsi-a)"/>
  <path class="flow" d="M 452 194 L 452 250" stroke="#6e6a63" marker-end="url(#tsi-a)"/>

  <!-- PROSE -->
  <rect class="card" x="28" y="258" width="160" height="196" rx="6"/>
  <text class="cap" x="42" y="279">PROSE</text>
  <text class="m" x="42" y="299" font-size="10.5">Meeting notes, strategy</text>
  <text class="m" x="42" y="313" font-size="10.5">docs, research logs</text>
  <line x1="42" y1="325" x2="174" y2="325" stroke="#e8e3d8"/>
  <text class="m" x="42" y="343" font-size="10.5">Split into passages,</text>
  <text class="m" x="42" y="357" font-size="10.5">then 120-token windows</text>
  <text class="m" x="42" y="371" font-size="10.5">Titles indexed too</text>
  <line x1="42" y1="383" x2="174" y2="383" stroke="#e8e3d8"/>
  <text class="t" x="42" y="404" font-size="13" font-weight="600">Embedding index</text>
  <text class="m" x="42" y="423" font-size="10.5">BGE-small, on the CPU</text>
  <text class="m" x="42" y="438" font-size="10.5">11,621 passages</text>

  <!-- GRIDS -->
  <rect class="card" x="200" y="258" width="160" height="196" rx="6"/>
  <text class="cap" x="214" y="279">GRIDS</text>
  <text class="m" x="214" y="299" font-size="10.5">Spreadsheets and</text>
  <text class="m" x="214" y="313" font-size="10.5">exported tables</text>
  <line x1="214" y1="325" x2="346" y2="325" stroke="#e8e3d8"/>
  <text class="m" x="214" y="343" font-size="10.5">Header row detected,</text>
  <text class="m" x="214" y="357" font-size="10.5">every column loaded</text>
  <text class="m" x="214" y="371" font-size="10.5">as text, cast in queries</text>
  <line x1="214" y1="383" x2="346" y2="383" stroke="#e8e3d8"/>
  <text class="t" x="214" y="404" font-size="13" font-weight="600">DuckDB</text>
  <text class="m" x="214" y="423" font-size="10.5">8,927 tables from</text>
  <text class="m" x="214" y="438" font-size="10.5">3,470 workbooks</text>

  <!-- RELATIONSHIPS -->
  <rect class="card" x="372" y="258" width="160" height="196" rx="6"/>
  <text class="cap" x="386" y="279">RELATIONSHIPS</text>
  <text class="m" x="386" y="299" font-size="10.5">Companies, people,</text>
  <text class="m" x="386" y="313" font-size="10.5">investors</text>
  <line x1="386" y1="325" x2="518" y2="325" stroke="#e8e3d8"/>
  <text class="m" x="386" y="343" font-size="10.5">Parsed from records</text>
  <text class="m" x="386" y="357" font-size="10.5">that already exist,</text>
  <text class="m" x="386" y="371" font-size="10.5">never inferred</text>
  <line x1="386" y1="383" x2="518" y2="383" stroke="#e8e3d8"/>
  <text class="t" x="386" y="404" font-size="13" font-weight="600">Kuzu</text>
  <text class="m" x="386" y="423" font-size="10.5">Node + relationship</text>
  <text class="m" x="386" y="438" font-size="10.5">tables, real Cypher</text>

  <!-- sensitivity note -->
  <rect x="28" y="480" width="504" height="58" rx="6" fill="#f6ece4"/>
  <text class="cap" x="44" y="501" fill="#b4541e">ORTHOGONAL TO ALL THREE</text>
  <text class="t" x="44" y="523" font-size="12">Sensitivity is a separate label, applied when a query runs — not implied by the store.</text>
</svg>
