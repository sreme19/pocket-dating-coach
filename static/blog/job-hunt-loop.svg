<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 640" width="580" height="640" role="img" aria-labelledby="jhlt jhld">
  <title id="jhlt">The job-hunt loop, with one human-only step</title>
  <desc id="jhld">Six stages in a loop. A company is found, then researched into a one-page brief, then checked against three fit rules. A fit gets drafted into an opening note; a non-fit is set aside and logged directly, no note written. Every drafted note is read, edited, and sent by a person by hand, since no automated path exists for that step. Every outcome, sent or set aside, lands in the shared notebook, which feeds a short weekly review that adjusts what gets searched for next.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .hot { fill: #f6ece4; stroke: #b4541e; stroke-width: 1.4; }
    .k { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; fill: #97928a; }
    .kb { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; fill: #b4541e; }
    .h { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 14.5px; fill: #17161b; }
    .s { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6e6a63; }
    .arrow { stroke: #97928a; stroke-width: 1.5; fill: none; }
    .back { stroke: #b4541e; stroke-width: 1.4; fill: none; }
    .lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #6e6a63; }
    .lblb { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #b4541e; font-weight: 600; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }

    @media (prefers-reduced-motion: no-preference) {
      .arrow { stroke-dasharray: 4 4; animation: jl-a 0.9s linear infinite; }
      .back  { stroke-dasharray: 5 4; animation: jl-b 1.0s linear infinite; }
    }
    @keyframes jl-a { to { stroke-dashoffset: -8; } }
    @keyframes jl-b { to { stroke-dashoffset: 9; } }
  </style>
  <rect class="bg" width="580" height="640" rx="8"/>

  <rect class="card" x="24" y="26" width="460" height="64" rx="6"/>
  <text class="k" x="44" y="48">FOUND</text>
  <text class="h" x="44" y="68">A company enters the queue</text>
  <text class="s" x="44" y="84">From a market scan, a source-specific scout, or a pasted lead</text>
  <path class="arrow" d="M254 90 L254 122" marker-end="url(#jha)"/>

  <rect class="card" x="24" y="126" width="460" height="72" rx="6"/>
  <text class="k" x="44" y="148">RESEARCHED</text>
  <text class="h" x="44" y="168">A one-page brief gets built</text>
  <text class="s" x="44" y="186">The right contact to reach, and why now is the moment</text>

  <path class="arrow" d="M180 198 L180 224" marker-end="url(#jha)"/>
  <text class="lbl" x="188" y="216">fit</text>
  <path class="arrow" d="M420 198 L400 224" marker-end="url(#jha)"/>
  <text class="lbl" x="410" y="210">risk</text>

  <rect class="card" x="24" y="228" width="272" height="64" rx="6"/>
  <text class="k" x="44" y="250">DRAFTED</text>
  <text class="h" x="44" y="270">An opening note gets written</text>
  <text class="s" x="44" y="284">Matched to the channel it goes out on</text>

  <rect class="card" x="312" y="228" width="172" height="64" rx="6"/>
  <text class="k" x="330" y="250">NOT A FIT</text>
  <text class="h" x="330" y="270">Set aside</text>
  <text class="s" x="330" y="284">Logged, no note written</text>

  <path class="arrow" d="M160 292 L160 322" marker-end="url(#jha)"/>

  <rect class="hot" x="24" y="326" width="460" height="76" rx="6"/>
  <text class="kb" x="44" y="350">SENT BY HAND</text>
  <text class="h" x="44" y="372">A person reads it, edits it, sends it</text>
  <text class="s" x="44" y="390">No automated path does this step instead</text>

  <path class="arrow" d="M254 402 L254 428" marker-end="url(#jha)"/>
  <path class="arrow" d="M398 292 L398 308 L500 308 L500 428" marker-end="url(#jha)"/>

  <rect class="card" x="24" y="432" width="460" height="64" rx="6"/>
  <text class="k" x="44" y="454">LOGGED</text>
  <text class="h" x="44" y="474">Recorded in the shared notebook</text>
  <text class="s" x="44" y="488">Who, when, how, and what happened</text>

  <path class="arrow" d="M254 496 L254 522" marker-end="url(#jha)"/>

  <rect class="card" x="24" y="526" width="460" height="64" rx="6"/>
  <text class="k" x="44" y="548">WEEKLY REVIEW</text>
  <text class="h" x="44" y="568">A short retro over the whole notebook</text>
  <text class="s" x="44" y="582">What's converting, what to change next round</text>

  <path class="back" d="M484 558 L536 558 L536 58 L484 58" marker-end="url(#jhb)"/>
  <text class="lblb" x="490" y="310" transform="rotate(90 490 310)" text-anchor="middle">feeds the next round</text>

  <text class="foot" x="254" y="618" text-anchor="middle">Five stages happen in code. One happens by hand, every single time.</text>

  <defs>
    <marker id="jha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#97928a"/>
    </marker>
    <marker id="jhb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4541e"/>
    </marker>
  </defs>
</svg>
