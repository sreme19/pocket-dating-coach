<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 850" width="560" height="850"
     role="img" aria-labelledby="tevkp-title tevkp-desc">
  <title id="tevkp-title">A kind property versus two relationship tables</title>
  <desc id="tevkp-desc">Two ways to model people in a graph, compared. Above: one Person node table carrying a kind property whose value is colleague, clinical, intimate or family. Every professional traversal has to add a WHERE clause filtering on that property. A traversal written by someone who never read the design doc omits the clause and returns a clinician, complete with an evidence string and a mention count that make the row look thoroughly sourced. The guarantee lives in each caller. Below: the same people reached through two separate relationship tables declared in Kuzu, worked with and known privately, both running from an Episode node to an Acquaintance node. The professional traversal names the worked-with relationship type, so a clinician, a partner or a family member is not reachable from it at all, whether or not the author of the query ever thought about them. The guarantee lives in the schema, checked by the store rather than by the caller. The price is paid once at write time, by the extraction rules that decide which table an edge goes into.</desc>

  <defs>
    <marker id="tevkp-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b46"/>
    </marker>
    <marker id="tevkp-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4541e"/>
    </marker>
    <marker id="tevkp-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6a63"/>
    </marker>
    <style>
      .h  { font-family: 'Iowan Old Style', Palatino, Georgia, serif; fill: #17161b; }
      .t  { font-family: system-ui, -apple-system, sans-serif; fill: #17161b; }
      .m  { font-family: system-ui, -apple-system, sans-serif; fill: #6e6a63; }
      .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
      .flow { fill: none; stroke-width: 2; stroke-dasharray: 7 5; }
      @media (prefers-reduced-motion: no-preference) {
        .flow { animation: tevkp-march 1.1s linear infinite; }
      }
      @keyframes tevkp-march { to { stroke-dashoffset: -12; } }
    </style>
  </defs>

  <rect width="560" height="850" fill="#fcfbf8"/>

  <!-- ================= PANEL A ================= -->
  <text class="h" x="28" y="40" font-size="18" font-weight="600">One node table, one kind property</text>
  <text class="m" x="28" y="62" font-size="12.5">The guarantee lives in every caller.</text>

  <!-- query box -->
  <rect class="card" x="28" y="80" width="228" height="74" rx="6"/>
  <text class="t" x="42" y="103" font-size="12.5" font-weight="600">Professional traversal</text>
  <text class="m" x="42" y="122" font-size="11.5">MATCH (:Episode)-[:KNOWS]-&gt;(p:Person)</text>
  <text class="m" x="42" y="139" font-size="11.5">WHERE p.kind = 'colleague'</text>

  <!-- forgetful query box -->
  <rect class="card" x="28" y="170" width="228" height="74" rx="6" stroke="#b4541e"/>
  <text class="t" x="42" y="193" font-size="12.5" font-weight="600" fill="#b4541e">The fifth query, written later</text>
  <text class="m" x="42" y="212" font-size="11.5">MATCH (:Episode)-[:KNOWS]-&gt;(p:Person)</text>
  <text class="m" x="42" y="229" font-size="11.5">— no WHERE clause</text>

  <!-- Person node table -->
  <rect class="card" x="332" y="80" width="200" height="164" rx="6"/>
  <text class="t" x="348" y="104" font-size="13" font-weight="600">Person</text>
  <line x1="348" y1="114" x2="516" y2="114" stroke="#e8e3d8"/>
  <text class="m" x="348" y="134" font-size="11.5">name</text>
  <text class="m" x="348" y="153" font-size="11.5">mentions</text>
  <text class="m" x="348" y="172" font-size="11.5">evidence</text>
  <text class="t" x="348" y="196" font-size="11.5" font-weight="600">kind</text>
  <text class="m" x="348" y="213" font-size="11">colleague · clinical</text>
  <text class="m" x="348" y="230" font-size="11">intimate · family</text>

  <path class="flow" d="M 256 117 L 322 117" stroke="#2f6b46" marker-end="url(#tevkp-arrow)"/>
  <path class="flow" d="M 256 207 L 322 207" stroke="#b4541e" marker-end="url(#tevkp-arrow-accent)"/>

  <rect x="28" y="262" width="504" height="52" rx="6" fill="#f6ece4"/>
  <text class="t" x="44" y="284" font-size="12" fill="#b4541e" font-weight="600">Returns a clinician.</text>
  <text class="m" x="44" y="303" font-size="12">Scored, sourced, with a mention count. Nothing about the row looks wrong.</text>

  <line x1="28" y1="348" x2="532" y2="348" stroke="#e8e3d8" stroke-width="1"/>

  <!-- ================= PANEL B ================= -->
  <text class="h" x="28" y="392" font-size="18" font-weight="600">Two relationship tables in Kuzu</text>
  <text class="m" x="28" y="414" font-size="12.5">The guarantee lives in the schema, checked by the store.</text>

  <!-- Episode hub -->
  <rect class="card" x="28" y="452" width="140" height="70" rx="6"/>
  <text class="t" x="44" y="478" font-size="13" font-weight="600">Episode</text>
  <text class="m" x="44" y="496" font-size="11">a time-boxed span</text>
  <text class="m" x="44" y="512" font-size="11">of the diary</text>

  <!-- colleague target -->
  <rect class="card" x="356" y="430" width="176" height="72" rx="6" stroke="#2f6b46"/>
  <text class="t" x="372" y="454" font-size="12.5" font-weight="600">Acquaintance</text>
  <text class="m" x="372" y="472" font-size="11">reached as a colleague</text>
  <text class="m" x="372" y="489" font-size="11">with the org on the edge</text>

  <!-- private target -->
  <rect class="card" x="356" y="530" width="176" height="86" rx="6"/>
  <text class="t" x="372" y="554" font-size="12.5" font-weight="600">Acquaintance</text>
  <text class="m" x="372" y="572" font-size="11">reached privately</text>
  <text class="m" x="372" y="589" font-size="11">clinician &#183; partner</text>
  <text class="m" x="372" y="606" font-size="11">family member</text>

  <!-- edges -->
  <text class="t" x="188" y="458" font-size="11.5" font-weight="600" fill="#2f6b46">WORKED_WITH</text>
  <path class="flow" d="M 168 472 L 346 472" stroke="#2f6b46" marker-end="url(#tevkp-arrow)"/>

  <text class="t" x="248" y="546" text-anchor="end" font-size="11.5" font-weight="600" fill="#6e6a63">KNOWN_PRIVATELY</text>
  <path class="flow" d="M 168 508 L 258 508 L 258 573 L 346 573"
        stroke="#6e6a63" marker-end="url(#tevkp-arrow-muted)"/>

  <!-- traversal box -->
  <rect class="card" x="28" y="644" width="504" height="70" rx="6" stroke="#2f6b46"/>
  <text class="t" x="44" y="668" font-size="12.5" font-weight="600">Professional traversal</text>
  <text class="m" x="44" y="687" font-size="11.5">MATCH (:Episode)-[:WORKED_WITH]-&gt;(a:Acquaintance)</text>
  <text class="m" x="44" y="705" font-size="11.5">The relationship type is the predicate. There is no WHERE clause to omit.</text>

  <rect x="28" y="730" width="504" height="72" rx="6" fill="#ffffff" stroke="#e8e3d8"/>
  <text class="t" x="44" y="753" font-size="12" fill="#2f6b46" font-weight="600">The lower row is not reachable from that query.</text>
  <text class="m" x="44" y="772" font-size="12">Not filtered out &#8212; unrepresentable, whether or not the author considered it.</text>
  <text class="m" x="44" y="791" font-size="12">The care moves to write time, where the extraction rules choose a table.</text>

  <text class="m" x="28" y="832" font-size="11">Kuzu declares each relationship table between a specific pair of node tables.</text>
</svg>
