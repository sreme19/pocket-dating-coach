<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 672" width="560" height="672"
     role="img" aria-labelledby="lg3Title lg3Desc">
  <title id="lg3Title">Three engines, three graph shapes over the same runtime</title>
  <desc id="lg3Desc">Three stacked panels, one per engine. The strategy oracle has eight nodes: a
  state node fans out to threat and coalition branches that fan in to belief, then a sequential spine
  to a fork that skips narration on a fatal error. The intelligence oracle has the same shape with ten
  nodes, its parallel branch being intel-network and coalition. The survey pipeline has eight nodes and
  no parallel branch at all — a strictly sequential chain into a gate that stops before the final step
  on a failed gate. The two oracles share the fan-out and fan-in lens; the survey pipeline is a straight
  line, showing that the gate and checkpointing earn the runtime even without any parallelism.</desc>

  <style>
    .paper{fill:#fcfbf8;} .panel{fill:#ffffff;stroke:#e8e3d8;stroke-width:1.5;}
    .soft{fill:#f6ece4;stroke:#e6d3c2;stroke-width:1;}
    .node{fill:#ffffff;stroke:#cdbfae;stroke-width:1.3;}
    .nacc{fill:#f6ece4;stroke:#b4541e;stroke-width:1.4;}
    .h{font-family:'Iowan Old Style',Palatino,Georgia,serif;fill:#17161b;}
    .l{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;}
    .ink{fill:#17161b;} .mut{fill:#6e6a63;} .acc{fill:#b4541e;}
    .edge{stroke:#6e6a63;stroke-width:1.5;fill:none;}
    .fan{stroke:#b4541e;stroke-width:1.6;fill:none;}
    .dot{fill:#b4541e;}
    @media (prefers-reduced-motion: no-preference){
      .fan{stroke-dasharray:5 5;animation:m3 1s linear infinite;}
      @keyframes m3{to{stroke-dashoffset:-10;}}
    }
  </style>
  <defs>
    <marker id="e3" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L6.5 3 L0 6 Z" fill="#6e6a63"/>
    </marker>
    <marker id="e3a" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L6.5 3 L0 6 Z" fill="#b4541e"/>
    </marker>
  </defs>

  <rect class="paper" x="0" y="0" width="560" height="672"/>
  <text class="h ink" x="28" y="40" font-size="21" font-weight="700">Three engines, three shapes</text>
  <text class="l mut" x="28" y="61" font-size="13">Same LangGraph runtime, one shared state — the topology is what differs</text>

  <!-- ============ Panel 1: Strategy oracle ============ -->
  <g>
    <rect class="panel" x="20" y="80" width="520" height="176" rx="14"/>
    <text class="h ink" x="40" y="110" font-size="16" font-weight="700">Strategy oracle</text>
    <rect class="soft" x="40" y="120" width="74" height="22" rx="11"/>
    <text class="l acc" x="77" y="135" font-size="11.5" font-weight="700" text-anchor="middle">8 nodes</text>
    <text class="l mut" x="330" y="112" font-size="12">fork → skip narration on a fatal error</text>

    <!-- schematic, centerline y=200 -->
    <circle class="dot" cx="56" cy="200" r="5"/>
    <path class="edge" d="M61 200 L78 200" marker-end="url(#e3)"/>
    <rect class="node" x="80" y="188" width="46" height="24" rx="7"/>
    <text class="l ink" x="103" y="204" font-size="11" text-anchor="middle">state</text>
    <!-- fan out -->
    <path class="fan" d="M126 200 L160 178" marker-end="url(#e3a)"/>
    <path class="fan" d="M126 200 L160 222" marker-end="url(#e3a)"/>
    <rect class="node" x="162" y="166" width="80" height="22" rx="11"/>
    <text class="l ink" x="202" y="181" font-size="11" text-anchor="middle">threat</text>
    <rect class="node" x="162" y="212" width="80" height="22" rx="11"/>
    <text class="l ink" x="202" y="227" font-size="11" text-anchor="middle">coalition</text>
    <!-- fan in -->
    <path class="fan" d="M242 177 L262 195" marker-end="url(#e3a)"/>
    <path class="fan" d="M242 223 L262 205" marker-end="url(#e3a)"/>
    <rect class="node" x="264" y="188" width="52" height="24" rx="7"/>
    <text class="l ink" x="290" y="204" font-size="11" text-anchor="middle">belief</text>
    <!-- spine -->
    <path class="edge" d="M316 200 L372 200" marker-end="url(#e3)"/>
    <circle class="mut" cx="332" cy="200" r="2.4" fill="#6e6a63"/>
    <circle class="mut" cx="346" cy="200" r="2.4" fill="#6e6a63"/>
    <circle class="mut" cx="360" cy="200" r="2.4" fill="#6e6a63"/>
    <text class="l mut" x="344" y="222" font-size="9.5" text-anchor="middle">spine</text>
    <!-- fork -->
    <path class="edge" d="M388 187 L400 200 L388 213 L376 200 Z" fill="#ffffff"/>
    <path class="edge" d="M400 200 L414 200" marker-end="url(#e3)"/>
    <rect class="nacc" x="416" y="188" width="62" height="24" rx="7"/>
    <text class="l ink" x="447" y="204" font-size="11" text-anchor="middle">narrate</text>
    <path class="edge" d="M478 200 L494 200" marker-end="url(#e3)"/>
    <rect class="soft" x="496" y="189" width="40" height="22" rx="11"/>
    <text class="l acc" x="516" y="204" font-size="10.5" font-weight="700" text-anchor="middle">END</text>
    <!-- error stub -->
    <path class="edge" d="M388 187 L388 172" marker-end="url(#e3)"/>
    <text class="l acc" x="394" y="170" font-size="9.5">on error → END</text>
  </g>

  <!-- ============ Panel 2: Intelligence oracle ============ -->
  <g>
    <rect class="panel" x="20" y="272" width="520" height="176" rx="14"/>
    <text class="h ink" x="40" y="302" font-size="16" font-weight="700">Intelligence oracle</text>
    <rect class="soft" x="40" y="312" width="82" height="22" rx="11"/>
    <text class="l acc" x="81" y="327" font-size="11.5" font-weight="700" text-anchor="middle">10 nodes</text>
    <text class="l mut" x="330" y="304" font-size="12">fork → skip narration on a fatal error</text>

    <!-- schematic, centerline y=392 -->
    <circle class="dot" cx="56" cy="392" r="5"/>
    <path class="edge" d="M61 392 L78 392" marker-end="url(#e3)"/>
    <rect class="node" x="80" y="380" width="46" height="24" rx="7"/>
    <text class="l ink" x="103" y="396" font-size="11" text-anchor="middle">state</text>
    <path class="fan" d="M126 392 L160 370" marker-end="url(#e3a)"/>
    <path class="fan" d="M126 392 L160 414" marker-end="url(#e3a)"/>
    <rect class="node" x="162" y="358" width="88" height="22" rx="11"/>
    <text class="l ink" x="206" y="373" font-size="10.5" text-anchor="middle">intel-network</text>
    <rect class="node" x="162" y="404" width="88" height="22" rx="11"/>
    <text class="l ink" x="206" y="419" font-size="11" text-anchor="middle">coalition</text>
    <path class="fan" d="M250 369 L270 387" marker-end="url(#e3a)"/>
    <path class="fan" d="M250 415 L270 397" marker-end="url(#e3a)"/>
    <rect class="node" x="272" y="380" width="52" height="24" rx="7"/>
    <text class="l ink" x="298" y="396" font-size="11" text-anchor="middle">belief</text>
    <!-- longer spine -->
    <path class="edge" d="M324 392 L388 392" marker-end="url(#e3)"/>
    <circle cx="338" cy="392" r="2.4" fill="#6e6a63"/>
    <circle cx="350" cy="392" r="2.4" fill="#6e6a63"/>
    <circle cx="362" cy="392" r="2.4" fill="#6e6a63"/>
    <circle cx="374" cy="392" r="2.4" fill="#6e6a63"/>
    <text class="l mut" x="356" y="414" font-size="9.5" text-anchor="middle">longer spine</text>
    <path class="edge" d="M404 379 L416 392 L404 405 L392 392 Z" fill="#ffffff"/>
    <path class="edge" d="M416 392 L430 392" marker-end="url(#e3)"/>
    <rect class="nacc" x="432" y="380" width="60" height="24" rx="7"/>
    <text class="l ink" x="462" y="396" font-size="11" text-anchor="middle">narrate</text>
    <path class="edge" d="M492 392 L506 392" marker-end="url(#e3)"/>
    <rect class="soft" x="508" y="381" width="28" height="22" rx="11"/>
    <text class="l acc" x="522" y="396" font-size="9" font-weight="700" text-anchor="middle">END</text>
    <path class="edge" d="M404 379 L404 364" marker-end="url(#e3)"/>
    <text class="l acc" x="410" y="362" font-size="9.5">on error → END</text>
  </g>

  <!-- ============ Panel 3: Survey pipeline ============ -->
  <g>
    <rect class="panel" x="20" y="464" width="520" height="184" rx="14"/>
    <text class="h ink" x="40" y="494" font-size="16" font-weight="700">Survey pipeline</text>
    <rect class="soft" x="40" y="504" width="74" height="22" rx="11"/>
    <text class="l acc" x="77" y="519" font-size="11.5" font-weight="700" text-anchor="middle">8 nodes</text>
    <text class="l mut" x="330" y="496" font-size="12">gate → stop before the final step on a fail</text>
    <text class="l acc" x="130" y="519" font-size="11" font-style="italic">no parallel branch — strictly sequential</text>

    <!-- schematic, centerline y=584 -->
    <circle class="dot" cx="52" cy="584" r="5"/>
    <path class="edge" d="M57 584 L72 584" marker-end="url(#e3)"/>
    <rect class="node" x="74" y="572" width="52" height="24" rx="7"/>
    <text class="l ink" x="100" y="588" font-size="10.5" text-anchor="middle">ingest</text>
    <path class="edge" d="M126 584 L138 584" marker-end="url(#e3)"/>
    <rect class="node" x="140" y="572" width="52" height="24" rx="7"/>
    <text class="l ink" x="166" y="588" font-size="10.5" text-anchor="middle">clean</text>
    <path class="edge" d="M192 584 L204 584" marker-end="url(#e3)"/>
    <rect class="node" x="206" y="572" width="52" height="24" rx="7"/>
    <text class="l ink" x="232" y="588" font-size="10.5" text-anchor="middle">schema</text>
    <path class="edge" d="M258 584 L286 584" marker-end="url(#e3)"/>
    <circle cx="270" cy="584" r="2.2" fill="#6e6a63"/>
    <!-- gate -->
    <path class="edge" d="M304 570 L320 584 L304 598 L288 584 Z" fill="#ffffff"/>
    <text class="l mut" x="304" y="587" font-size="9" text-anchor="middle">gate</text>
    <path class="edge" d="M320 584 L336 584" marker-end="url(#e3)"/>
    <rect class="node" x="338" y="572" width="70" height="24" rx="7"/>
    <text class="l ink" x="373" y="588" font-size="10.5" text-anchor="middle">finalize</text>
    <path class="edge" d="M408 584 L424 584" marker-end="url(#e3)"/>
    <rect class="soft" x="426" y="573" width="40" height="22" rx="11"/>
    <text class="l acc" x="446" y="588" font-size="10.5" font-weight="700" text-anchor="middle">END</text>
    <!-- fail branch -->
    <path class="edge" d="M304 570 L304 552" marker-end="url(#e3)"/>
    <text class="l acc" x="310" y="550" font-size="9.5">on fail → END (skips finalize)</text>
  </g>
</svg>
