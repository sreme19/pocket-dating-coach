<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" width="560" height="450" role="img" aria-labelledby="cft2 cfd2">
  <title id="cft2">Answering a what-if by re-running the same function</title>
  <desc id="cfd2">Because scoring is a pure function of three stored vectors, a counterfactual is not an estimate. Take the current inputs, change one confidence value from unproven to proven, run exactly the same arithmetic, and compare the two rankings. The difference is the real answer, not a model's opinion about what might happen.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .alt { fill: #f6ece4; stroke: #b4541e; stroke-width: 1.4; }
    .fn { fill: #f4f1ea; stroke: #ddd7ca; stroke-width: 1.2; }
    .k { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; fill: #97928a; }
    .h { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 14px; fill: #17161b; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #3f3c45; }
    .mb { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #b4541e; }
    .arrow { stroke: #97928a; stroke-width: 1.5; fill: none; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
    @media (prefers-reduced-motion: no-preference) {
      .arrow { stroke-dasharray: 4 4; animation: fl-cf 0.9s linear infinite; }
    }
    @keyframes fl-cf { to { stroke-dashoffset: -8; } }
  </style>
  <rect class="bg" width="560" height="450" rx="8"/>
  <text class="k" x="34" y="28">TODAY</text>
  <rect class="card" x="24" y="40" width="230" height="76" rx="6"/>
  <text class="m" x="44" y="66">finance claimed 90</text>
  <text class="m" x="44" y="88">confidence 0.3</text>
  <text class="m" x="44" y="108">→ contributes 27</text>
  <text class="k" x="308" y="28">IF HE PROVES IT</text>
  <rect class="alt" x="298" y="40" width="230" height="76" rx="6"/>
  <text class="mb" x="318" y="66">finance claimed 90</text>
  <text class="mb" x="318" y="88">confidence 1.0</text>
  <text class="mb" x="318" y="108">→ contributes 90</text>
  <path class="arrow" d="M139 116 L200 168" marker-end="url(#cf)"/>
  <path class="arrow" d="M413 116 L352 168" marker-end="url(#cf)"/>
  <rect class="fn" x="150" y="172" width="260" height="56" rx="6"/>
  <text class="h" x="280" y="198" text-anchor="middle">The identical function</text>
  <text class="m" x="280" y="218" text-anchor="middle">no model, no estimate</text>
  <path class="arrow" d="M280 228 L280 258" marker-end="url(#cf)"/>
  <rect class="card" x="24" y="262" width="512" height="86" rx="6"/>
  <text class="h" x="44" y="290">Her ranking, before and after</text>
  <text class="m" x="44" y="316">4th  →  2nd</text>
  <text class="m" x="180" y="316">of nine active suitors</text>
  <rect class="card" x="24" y="368" width="512" height="60" rx="6"/>
  <text class="foot" x="280" y="394" text-anchor="middle">This is not a prediction of what proving it might do.</text>
  <text class="foot" x="280" y="414" text-anchor="middle">It is the same arithmetic, run twice, with one number changed.</text>
  <defs>
    <marker id="cf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#97928a"/>
    </marker>
  </defs>
</svg>
