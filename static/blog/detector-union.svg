<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-labelledby="dut dud">
  <title id="dut">Five independent checks, one shared output shape</title>
  <desc id="dud">One enriched set of contact attempts feeds five detectors that know nothing about each other: calls placed outside permitted local hours, too many attempts to the same person in a day, any attempt after someone opted out, a match against the do-not-call register, and an attempt with no recorded consent. Each emits the same three fields — what was violated, how severe it is, and the supporting detail — so they can be unioned into a single table. Adding a sixth regulation means adding a sixth query, not changing the schema.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .src { fill: #f4f1ea; stroke: #ddd7ca; stroke-width: 1.2; }
    .out { fill: #f6ece4; stroke: #b4541e; stroke-width: 1.4; }
    .h { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 13.5px; fill: #17161b; }
    .s { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #6e6a63; }
    .sev { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    .crit { fill: #b4541e; } .hi { fill: #6e6a63; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #b4541e; }
    .arrow { stroke: #97928a; stroke-width: 1.3; fill: none; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
    @media (prefers-reduced-motion: no-preference) {
      .arrow { stroke-dasharray: 4 4; animation: fl-du 0.9s linear infinite; }
    }
    @keyframes fl-du { to { stroke-dashoffset: -8; } }
  </style>
  <rect class="bg" width="560" height="560" rx="8"/>
  <rect class="src" x="150" y="18" width="260" height="42" rx="6"/>
  <text class="h" x="280" y="45" text-anchor="middle">One enriched set of attempts</text>
  <path class="arrow" d="M200 60 L120 96" marker-end="url(#du)"/>
  <path class="arrow" d="M240 60 L215 96" marker-end="url(#du)"/>
  <path class="arrow" d="M280 60 L280 96" marker-end="url(#du)"/>
  <path class="arrow" d="M320 60 L345 96" marker-end="url(#du)"/>
  <path class="arrow" d="M360 60 L440 96" marker-end="url(#du)"/>
  <rect class="card" x="24" y="100" width="512" height="34" rx="5"/>
  <text class="h" x="44" y="122">Called outside permitted local hours</text>
  <text class="sev hi" x="470" y="122">HIGH</text>
  <rect class="card" x="24" y="140" width="512" height="34" rx="5"/>
  <text class="h" x="44" y="162">Too many attempts in one day</text>
  <text class="sev hi" x="452" y="162">MEDIUM</text>
  <rect class="card" x="24" y="180" width="512" height="34" rx="5"/>
  <text class="h" x="44" y="202">Attempted after they opted out</text>
  <text class="sev hi" x="470" y="202">HIGH</text>
  <rect class="card" x="24" y="220" width="512" height="34" rx="5"/>
  <text class="h" x="44" y="242">Matched the do-not-call register</text>
  <text class="sev crit" x="450" y="242">CRITICAL</text>
  <rect class="card" x="24" y="260" width="512" height="34" rx="5"/>
  <text class="h" x="44" y="282">No recorded consent</text>
  <text class="sev hi" x="470" y="282">HIGH</text>
  <path class="arrow" d="M120 294 L240 336" marker-end="url(#du)"/>
  <path class="arrow" d="M280 294 L280 336" marker-end="url(#du)"/>
  <path class="arrow" d="M440 294 L320 336" marker-end="url(#du)"/>
  <rect class="out" x="130" y="340" width="300" height="76" rx="6"/>
  <text class="h" x="280" y="366" text-anchor="middle">One table, one shape</text>
  <text class="m" x="280" y="392" text-anchor="middle">what · how severe · the detail</text>
  <rect class="card" x="24" y="446" width="512" height="88" rx="6"/>
  <text class="foot" x="280" y="474" text-anchor="middle">The detectors know nothing about each other.</text>
  <text class="foot" x="280" y="496" text-anchor="middle">A sixth regulation is a sixth query — not a schema change,</text>
  <text class="foot" x="280" y="516" text-anchor="middle">not a migration, and not a rewrite of the five that already work.</text>
  <defs>
    <marker id="du" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#97928a"/>
    </marker>
  </defs>
</svg>
