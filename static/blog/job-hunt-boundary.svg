<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-labelledby="jhbt jhbd">
  <title id="jhbt">What the system does itself, and the one line only a person crosses</title>
  <desc id="jhbd">Two things happen inside the system: it searches the open web for public information, and it writes a draft message as plain text. A dashed boundary marks a line the system never crosses. Below that line, only a person acts: logging into the network on their own account, and clicking send, the one step nothing else in the system can trigger.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .hot { fill: #f6ece4; stroke: #b4541e; stroke-width: 1.4; }
    .k { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; fill: #97928a; }
    .kb { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; fill: #b4541e; }
    .sec { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; fill: #6e6a63; }
    .secb { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; fill: #b4541e; }
    .h { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 14.5px; fill: #17161b; }
    .s { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6e6a63; }
    .boundary { stroke: #b4541e; stroke-width: 1.4; fill: none; }
    .lblb { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #b4541e; font-weight: 600; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }

    @media (prefers-reduced-motion: no-preference) {
      .boundary { stroke-dasharray: 5 4; animation: jb-a 1.1s linear infinite; }
    }
    @keyframes jb-a { to { stroke-dashoffset: -9; } }
  </style>
  <rect class="bg" width="560" height="400" rx="8"/>

  <text class="sec" x="24" y="44">WHAT THE SYSTEM DOES ITSELF</text>

  <rect class="card" x="24" y="54" width="248" height="96" rx="6"/>
  <text class="k" x="42" y="78">RESEARCH</text>
  <text class="h" x="42" y="98">Searches the open web</text>
  <text class="s" x="42" y="116">For public information only</text>

  <rect class="card" x="288" y="54" width="248" height="96" rx="6"/>
  <text class="k" x="306" y="78">DRAFTING</text>
  <text class="h" x="306" y="98">Writes a draft message</text>
  <text class="s" x="306" y="116">Text only, saved to a file</text>

  <line class="boundary" x1="24" y1="176" x2="536" y2="176"/>
  <circle cx="280" cy="176" r="10" fill="#fcfbf8" stroke="#b4541e" stroke-width="1.4"/>
  <path d="M273 169 L287 183" stroke="#b4541e" stroke-width="1.4"/>
  <text class="lblb" x="280" y="200" text-anchor="middle">the system never crosses this line</text>

  <text class="secb" x="24" y="230">WHAT ONLY A PERSON DOES</text>

  <rect class="hot" x="24" y="240" width="248" height="96" rx="6"/>
  <text class="kb" x="42" y="264">ACCESS</text>
  <text class="h" x="42" y="284">Logs into the network</text>
  <text class="s" x="42" y="302">On their own account, every time</text>

  <rect class="hot" x="288" y="240" width="248" height="96" rx="6"/>
  <text class="kb" x="306" y="264">SEND</text>
  <text class="h" x="306" y="284">Clicks send</text>
  <text class="s" x="306" y="302">The one step nothing else can trigger</text>

  <text class="foot" x="280" y="372" text-anchor="middle">Above the line: public search and drafted text. Below it: a person, on their own account, every time.</text>
</svg>
