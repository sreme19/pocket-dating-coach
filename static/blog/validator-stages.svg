<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" width="560" height="620" role="img" aria-labelledby="vst vsd">
  <title id="vst">Two-stage compliance gate on every outbound message</title>
  <desc id="vsd">A generated reply passes through two stages before it can be sent. Stage one is a regular-expression scan for personal data, which fails closed: on any error the message is blocked. Stage two is a small model grading the large model's output against ten forbidden behaviours, which fails open: on any error the message passes. A block does not immediately deflect. The generator gets one corrective regeneration with the violation named, and only if that also fails is a safe fallback substituted.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .warm { fill: #f6ece4; stroke: #b4541e; stroke-width: 1.4; }
    .h { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 15px; fill: #17161b; }
    .s { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
    .pill { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; }
    .closed { fill: #2f6b46; }
    .open { fill: #b4541e; }
    .arrow { stroke: #97928a; stroke-width: 1.5; fill: none; }
    .lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #97928a; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
  
    /* dashes march along each connector so the diagram reads as live flow.
       one dash period per cycle keeps the loop seamless. */
    @media (prefers-reduced-motion: no-preference) {
      .arrow { stroke-dasharray: 4 4; animation: fl-arrow 0.9s linear infinite; }
    }
    @keyframes fl-arrow { to { stroke-dashoffset: -8; } }
  </style>
  <rect class="bg" width="560" height="620" rx="8"/>
  <rect class="card" x="150" y="20" width="260" height="52" rx="6"/>
  <text class="h" x="280" y="52" text-anchor="middle">Generated reply</text>
  <path class="arrow" d="M280 72 L280 96" marker-end="url(#v)"/>
  <rect class="card" x="60" y="100" width="440" height="82" rx="6"/>
  <text class="pill closed" x="80" y="124">STAGE 1 · FAILS CLOSED · 7 PATTERNS</text>
  <text class="h" x="80" y="148">Pattern scan for personal data</text>
  <text class="s" x="80" y="168">Email, two phone formats, four identity documents.</text>
  <path class="arrow" d="M280 182 L280 206" marker-end="url(#v)"/>
  <rect class="card" x="60" y="210" width="440" height="82" rx="6"/>
  <text class="pill open" x="80" y="234">STAGE 2 · FAILS OPEN · 10 RULES</text>
  <text class="h" x="80" y="258">Claude Haiku 4.5 grades Claude Sonnet 4.5</text>
  <text class="s" x="80" y="278">Impersonation, invented facts, money-as-desirability.</text>
  <path class="arrow" d="M280 292 L280 316" marker-end="url(#v)"/>
  <rect class="warm" x="60" y="320" width="440" height="82" rx="6"/>
  <text class="h" x="80" y="350">Blocked? One corrective regeneration</text>
  <text class="s" x="80" y="370">The generator is re-prompted with the violation named,</text>
  <text class="s" x="80" y="388">then graded again. Only then does it give up.</text>
  <path class="arrow" d="M170 402 L170 440" marker-end="url(#v)"/>
  <path class="arrow" d="M390 402 L390 440" marker-end="url(#v)"/>
  <text class="lbl" x="182" y="426">passes</text>
  <text class="lbl" x="402" y="426">fails twice</text>
  <rect class="card" x="60" y="444" width="200" height="60" rx="6"/>
  <text class="h" x="160" y="480" text-anchor="middle">Sent</text>
  <rect class="card" x="300" y="444" width="200" height="60" rx="6"/>
  <text class="h" x="400" y="472" text-anchor="middle">Safe fallback</text>
  <text class="s" x="400" y="492" text-anchor="middle">logged as a violation</text>
  <rect x="60" y="528" width="440" height="72" rx="6" fill="#ffffff" stroke="#e8e3d8"/>
  <text class="foot" x="280" y="554" text-anchor="middle">The two stages fail in opposite directions on purpose.</text>
  <text class="foot" x="280" y="574" text-anchor="middle">A regex outage is a bug. A model outage is a Tuesday —</text>
  <text class="foot" x="280" y="592" text-anchor="middle">and blocking every message through one is its own incident.</text>
  <defs>
    <marker id="v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#97928a"/>
    </marker>
  </defs>
</svg>
