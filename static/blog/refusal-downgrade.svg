<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-labelledby="rdt rdd">
  <title id="rdt">A refusal read as a red flag, and the rule that stops it</title>
  <desc id="rdd">A man declines a request for income proof, saying he is not applying for a loan. The model reads the tone as evasive and raises a concern flag, which surfaces to the woman as a note that he is financially evasive. The deterministic rule checks whether the same turn was a proof refusal, and if so forces the flag back to neutral and logs the downgrade. Declining to prove something is a boundary, not a warning sign, and the rule encodes that rather than asking the model to remember it.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .bad { fill: #ffffff; stroke: #b4541e; stroke-width: 1.5; }
    .ok { fill: #f2f6f3; stroke: #2f6b46; stroke-width: 1.4; }
    .k { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; fill: #97928a; }
    .msg { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 14px; fill: #17161b; font-style: italic; }
    .h { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 14px; fill: #17161b; }
    .s { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
    .flagbad { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #b4541e; }
    .flagok { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #2f6b46; }
    .arrow { stroke: #97928a; stroke-width: 1.5; fill: none; }
    .rule { stroke: #2f6b46; stroke-width: 1.6; fill: none; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
    @media (prefers-reduced-motion: no-preference) {
      .arrow { stroke-dasharray: 4 4; animation: fl-r 0.9s linear infinite; }
      .rule { stroke-dasharray: 5 4; animation: fl-r2 0.85s linear infinite; }
    }
    @keyframes fl-r { to { stroke-dashoffset: -8; } }
    @keyframes fl-r2 { to { stroke-dashoffset: -9; } }
  </style>
  <rect class="bg" width="560" height="470" rx="8"/>
  <text class="k" x="34" y="28">WHAT HE SAID</text>
  <rect class="card" x="24" y="40" width="512" height="62" rx="6"/>
  <text class="msg" x="44" y="68">Stop asking me for income proof.</text>
  <text class="msg" x="44" y="90">I&#39;m not applying for a loan.</text>
  <path class="arrow" d="M280 102 L280 128" marker-end="url(#rr)"/>
  <text class="k" x="34" y="150">WHAT THE MODEL CONCLUDED</text>
  <rect class="bad" x="24" y="162" width="512" height="62" rx="6"/>
  <text class="flagbad" x="44" y="188">CONCERN RAISED</text>
  <text class="s" x="44" y="210">Surfaced to her as: he is being financially evasive</text>
  <path class="rule" d="M280 224 L280 250" marker-end="url(#rg)"/>
  <text class="k" x="34" y="272">WHAT THE RULE DOES</text>
  <rect class="ok" x="24" y="284" width="512" height="76" rx="6"/>
  <text class="h" x="44" y="310">Was this same turn a refusal to supply proof?</text>
  <text class="flagok" x="44" y="336">YES → force the flag to neutral, and log the downgrade</text>
  <text class="s" x="44" y="352">Declining to prove something is a boundary, not a warning sign</text>
  <rect class="card" x="24" y="384" width="512" height="66" rx="6"/>
  <text class="foot" x="280" y="410" text-anchor="middle">The model is not asked to remember this. It cannot be relied on to.</text>
  <text class="foot" x="280" y="434" text-anchor="middle">The rule holds whatever the tone of the sentence happens to be.</text>
  <defs>
    <marker id="rr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#97928a"/>
    </marker>
    <marker id="rg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b46"/>
    </marker>
  </defs>
</svg>
