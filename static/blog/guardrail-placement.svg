<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" width="560" height="600" role="img" aria-labelledby="gpt gpd">
  <title id="gpt">The same protection, written in code and bought as infrastructure</title>
  <desc id="gpd">In the application-code version, every protection is something you wrote: a keyword list, a prompt with rules in it, and a set of forbidden patterns checked after the model replies. You can read all of it, and it only protects the one route it is wired into. In the platform version, a managed guardrail wraps both the input and the output, personal details are redacted before the model sees them, whole topics are refused, and the same guardrail is attached again inside the retrieval step. You cannot read the implementation, but it protects every path that calls it, including ones written later by someone else.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .mine { fill: #f2f6f3; stroke: #2f6b46; stroke-width: 1.3; }
    .plat { fill: #f6ece4; stroke: #b4541e; stroke-width: 1.4; }
    .k { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; }
    .kg { fill: #2f6b46; } .ko { fill: #b4541e; }
    .h { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-size: 13.5px; fill: #17161b; }
    .s { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6e6a63; }
    .arrow { stroke: #97928a; stroke-width: 1.4; fill: none; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6e6a63; }
    @media (prefers-reduced-motion: no-preference) {
      .arrow { stroke-dasharray: 4 4; animation: fl-gp 0.9s linear infinite; }
    }
    @keyframes fl-gp { to { stroke-dashoffset: -8; } }
  </style>
  <rect class="bg" width="560" height="600" rx="8"/>
  <text class="k kg" x="34" y="26">WRITTEN IN APPLICATION CODE</text>
  <rect class="mine" x="24" y="38" width="512" height="44" rx="6"/>
  <text class="h" x="44" y="58">Keyword list, checked before the call</text>
  <text class="s" x="44" y="74">you wrote it · you can read it · one route only</text>
  <path class="arrow" d="M280 82 L280 96" marker-end="url(#gp)"/>
  <rect class="mine" x="24" y="100" width="512" height="44" rx="6"/>
  <text class="h" x="44" y="120">Rules written into the prompt</text>
  <text class="s" x="44" y="136">instructions, not constraints</text>
  <path class="arrow" d="M280 144 L280 158" marker-end="url(#gp)"/>
  <rect class="card" x="180" y="162" width="200" height="40" rx="6"/>
  <text class="h" x="280" y="187" text-anchor="middle">The model</text>
  <path class="arrow" d="M280 202 L280 216" marker-end="url(#gp)"/>
  <rect class="mine" x="24" y="220" width="512" height="44" rx="6"/>
  <text class="h" x="44" y="240">Forbidden patterns, checked after</text>
  <text class="s" x="44" y="256">catches what you enumerated · misses paraphrase</text>
  <text class="k ko" x="34" y="316">BOUGHT AS PLATFORM INFRASTRUCTURE</text>
  <rect class="plat" x="24" y="328" width="512" height="44" rx="6"/>
  <text class="h" x="44" y="348">Guardrail wraps the input</text>
  <text class="s" x="44" y="364">personal details redacted before the model sees them</text>
  <path class="arrow" d="M280 372 L280 386" marker-end="url(#gp)"/>
  <rect class="card" x="130" y="390" width="300" height="52" rx="6"/>
  <text class="h" x="280" y="412" text-anchor="middle">Retrieval, then the model</text>
  <text class="s" x="280" y="430" text-anchor="middle">the same guardrail attached again, inside</text>
  <path class="arrow" d="M280 442 L280 456" marker-end="url(#gp)"/>
  <rect class="plat" x="24" y="460" width="512" height="44" rx="6"/>
  <text class="h" x="44" y="480">Guardrail wraps the output</text>
  <text class="s" x="44" y="496">whole topics refused · applies to every caller, including future ones</text>
  <rect class="card" x="24" y="524" width="512" height="60" rx="6"/>
  <text class="foot" x="280" y="550" text-anchor="middle">One you can read but must remember to wire in everywhere.</text>
  <text class="foot" x="280" y="570" text-anchor="middle">One you cannot read but cannot forget to apply.</text>
  <defs>
    <marker id="gp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#97928a"/>
    </marker>
  </defs>
</svg>
