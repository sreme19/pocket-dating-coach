<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" width="560" height="500" role="img" aria-labelledby="cst csd">
  <title id="cst">The output shape changes with the input</title>
  <desc id="csd">Five mappings from a context block being present to an extra field the model must return. A pending proof request adds a refusal field. An active checklist adds a completed-items field. A hand-off in progress adds a wrap-up field. Networking mode adds a romantic-pressure field. A pending consent question adds a consent-answer field. The prompt then states the exact number of fields required, so the model is never asked for a field this turn cannot produce.</desc>
  <style>
    .bg { fill: #fcfbf8; }
    .card { fill: #ffffff; stroke: #e8e3d8; stroke-width: 1; }
    .k { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; fill: #97928a; }
    .l { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: #3f3c45; }
    .f { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #b4541e; }
    .arrow { stroke: #c9c4bb; stroke-width: 1.3; fill: none; }
    .foot { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #6e6a63; }
  
    /* dashes march along each connector so the diagram reads as live flow.
       one dash period per cycle keeps the loop seamless. */
    @media (prefers-reduced-motion: no-preference) {
      .arrow { stroke-dasharray: 3 3; animation: fl-arrow 0.8s linear infinite; }
    }
    @keyframes fl-arrow { to { stroke-dashoffset: -6; } }
  </style>
  <rect class="bg" width="560" height="500" rx="8"/>
  <text class="k" x="30" y="30">IF THIS BLOCK IS PRESENT</text>
  <text class="k" x="330" y="30">THE MODEL MUST ALSO RETURN</text>
  <rect class="card" x="24" y="42" width="512" height="52" rx="6"/>
  <text class="l" x="42" y="74">A proof request is pending</text>
  <path class="arrow" d="M288 68 L322 68" marker-end="url(#d)"/>
  <text class="f" x="334" y="73">proofRefusal</text>
  <rect class="card" x="24" y="104" width="512" height="52" rx="6"/>
  <text class="l" x="42" y="136">A vetting checklist is active</text>
  <path class="arrow" d="M288 130 L322 130" marker-end="url(#d)"/>
  <text class="f" x="334" y="135">itemsDone</text>
  <rect class="card" x="24" y="166" width="512" height="52" rx="6"/>
  <text class="l" x="42" y="198">A hand-off is in progress</text>
  <path class="arrow" d="M288 192 L322 192" marker-end="url(#d)"/>
  <text class="f" x="334" y="197">wrapUp</text>
  <rect class="card" x="24" y="228" width="512" height="52" rx="6"/>
  <text class="l" x="42" y="260">Networking mode is on</text>
  <path class="arrow" d="M288 254 L322 254" marker-end="url(#d)"/>
  <text class="f" x="334" y="259">romanticPressure</text>
  <rect class="card" x="24" y="290" width="512" height="52" rx="6"/>
  <text class="l" x="42" y="322">A consent question is pending</text>
  <path class="arrow" d="M288 316 L322 316" marker-end="url(#d)"/>
  <text class="f" x="334" y="321">consentAnswer</text>
  <rect x="24" y="374" width="512" height="104" rx="6" fill="#ffffff" stroke="#e8e3d8"/>
  <text class="foot" x="280" y="402" text-anchor="middle">The prompt then states the exact field count it expects.</text>
  <text class="foot" x="280" y="424" text-anchor="middle">The model is never asked for a field this turn cannot produce,</text>
  <text class="foot" x="280" y="446" text-anchor="middle">so it never has to invent one to satisfy the shape —</text>
  <text class="foot" x="280" y="466" text-anchor="middle">and the parser never has to decide whether a null was meaningful.</text>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9c4bb"/>
    </marker>
  </defs>
</svg>
